services:
  mastermind-runtime:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
      RUNTIME_SHARED_SECRET: "CHANGE_ME"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8787:8787"
    security_opt:
      - no-new-privileges:true
