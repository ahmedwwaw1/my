name: Verify Resource Enforcement
on:
  push:
    branches: [main]
jobs:
  verify:
    if: !contains(github.event.head_commit.message, 'Finalize Resource Enforcement')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check my_AI/universal_skill_execution_adapter.js
          node --check Mastermind_Desktop/universal_skill_execution_adapter.js
          node --check my_AI/universal_skill_execution_sandbox_engine.js
          node --check Mastermind_Desktop/universal_skill_execution_sandbox_engine.js
      - name: Docker enforcement
        run: |
          node - <<'NODE'
          const {executeDocker}=require('./my_AI/universal_skill_execution_adapter');
          (async()=>{
            const ok=await executeDocker('node --check my_AI/ai_engine_core.js',{workingDirectory:process.cwd(),sandboxId:'verify-ok',timeoutMs:30000,maxOutputBytes:8000,filesystem:'workspace-readonly'});
            if(ok.success!==true || ok.isolationLevel!=='container-isolated' || ok.network!=='none-enforced' || ok.readOnlyRoot!==true || ok.capDropAll!==true || ok.noNewPrivileges!==true) throw new Error('docker proof failed '+JSON.stringify(ok));
            const timeout=await executeDocker('node -e "setTimeout(()=>{},10000)"',{workingDirectory:process.cwd(),sandboxId:'verify-timeout',timeoutMs:1500,maxOutputBytes:2000});
            if(timeout.timedOut!==true || timeout.killed!==true || timeout.killController?.scope!=='container') throw new Error('docker kill proof failed '+JSON.stringify(timeout));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Desktop enforcement contract
        run: |
          node - <<'NODE'
          const {executeProcess}=require('./Mastermind_Desktop/universal_skill_execution_adapter');
          (async()=>{
            const r=await executeProcess('node --check Mastermind_Desktop/core.js',{cwd:process.cwd(),timeoutMs:30000,maxOutputBytes:8000});
            if(r.success!==true || r.isolationLevel!=='process-isolated' || r.shell!==false) throw new Error('desktop proof failed '+JSON.stringify(r));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Finalize and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/verify_resource_enforcement.yml
          git commit -m 'Finalize Resource Enforcement'
          git push
