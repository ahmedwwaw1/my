# one-shot re-upgrade trigger
name: Re-upgrade Cloud Discovery Scan

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Re-apply cloud discovery engine
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const corePath = 'my_AI/ai_engine_core.js';
          const enginePath = 'my_AI/discovery_scan_engine.js';
          const marker = '// --- [AI Engine Logic] ---';
          const core = fs.readFileSync(corePath, 'utf8');
          const engine = fs.readFileSync(enginePath, 'utf8').trim();
          if (core.includes('const CLOUD_ARCH_SCAN_LIMITS')) throw new Error('Core already contains the cloud discovery engine.');
          if (!core.includes(marker)) throw new Error(`Core marker not found: ${marker}`);
          let patched = core.replace(marker, `${engine}\n\n${marker}`);
          const discoveryRegex = /(else if \(name === ["']discovery_scan["']\) \{)[\s\S]*?(?=\n\s*else if \(name === )/;
          if (!discoveryRegex.test(patched)) throw new Error('Existing discovery_scan branch was not found.');
          patched = patched.replace(discoveryRegex, `$1\n        try {\n            toolResult = await performCloudArchitectureDiscovery(safePath || "");\n        } catch (scanError) {\n            toolResult = {\n                error: "Cloud discovery scan failed.",\n                details: scanError?.message || String(scanError),\n                fallback: await listGithubFiles(safePath || "")\n            };\n        }\n    }`);
          fs.writeFileSync(corePath, patched, 'utf8');
          NODE

      - name: Validate JavaScript
        run: |
          node --check my_AI/ai_engine_core.js
          node --check my_AI/discovery_scan_engine.js

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_AI/ai_engine_core.js
          git rm .github/workflows/reupgrade_cloud_discovery_scan.yml
          git commit -m "Re-upgrade cloud discovery scan on restored core"
          git push
