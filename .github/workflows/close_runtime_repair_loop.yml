name: Close Runtime Repair Loop
on:
  push:
    paths:
      - '.github/workflows/close_runtime_repair_loop.yml'

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrate bounded autonomous repair loop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          engine = Path('my_AI/universal_runtime_verification_engine.js')
          text = engine.read_text()
          start = text.index('async function runUniversalRuntimeVerification(options={})')
          end = text.index("if(typeof module!=='undefined')module.exports=", start)

          replacement = r'''async function runUniversalRuntimeVerification(options={}){if(typeof options.execute!=='function')return{available:false,version:UNIVERSAL_RUNTIME_VERIFICATION_VERSION,error:'No runtime command executor supplied.'};const env=options.environment||'Unknown',snapshot=options.snapshot||{},root=options.root||snapshot.root||'.',phases=[],commands=urvCommands(snapshot,options),retries=Math.max(0,Number(options.maxRetries??1));for(const item of commands){let ev=null;for(let i=0;i<=retries;i++){ev=await urvExec(options,item.phase,item.command);ev.attempt=i+1;if(ev.ok)break;}phases.push({...item,evidence:ev});if(!ev.ok&&options.stopOnFailure!==false)break;}let pid=null,runtimeStarted=false,ports=[],health=[],runtimeLog=null;const startCommand=options.startCommand||urvScripts(snapshot).start||urvScripts(snapshot).dev;try{if(startCommand&&options.runRuntime!==false&&phases.every(p=>p.evidence.ok)){const logFile=options.logFile||'.agent-runtime.log';const start=await urvExec(options,'start',urvStart(env,root,startCommand,logFile));phases.push({phase:'start',command:start.command,evidence:start});const ids=start.output.match(/\b\d{1,12}\b/g)||[];pid=ids[ids.length-1]||null;runtimeStarted=Boolean(pid)&&start.ok;if(runtimeStarted){for(let i=0;i<Math.max(1,Number(options.runtimeChecks??3));i++){const m=await urvExec(options,'process-monitor',urvMonitor(env,pid));phases.push({phase:'process-monitor',command:m.command,evidence:m});const p=await urvExec(options,'port-monitor',urvPorts(env));phases.push({phase:'port-monitor',command:p.command,evidence:p});ports=urvString(p.output).split(/[,\s]+/).filter(x=>/^\d+$/.test(x));if(options.healthUrl)health.push(await urvExec(options,'api-smoke',urvHttp(env,options.healthUrl)));else if(options.apiPath&&ports[0])health.push(await urvExec(options,'api-smoke',urvHttp(env,`http://127.0.0.1:${ports[0]}${options.apiPath}`)));if(health.some(x=>x.ok))break;}runtimeLog=await urvExec(options,'runtime-log',urvLog(env,root,options.logFile||'.agent-runtime.log'));phases.push({phase:'runtime-log',command:runtimeLog.command,evidence:runtimeLog});}}}finally{if(pid){const stop=await urvExec(options,'stop',urvStop(env,pid));phases.push({phase:'stop',command:stop.command,evidence:stop});}}const failed=[...phases.map(p=>p.evidence).filter(e=>!e.ok),...health.filter(e=>!e.ok)],firstFailure=failed[0]||null;let postSnapshot=null,architectureDiff=null,postSnapshotError=null;if(typeof options.discover==='function'){try{postSnapshot=await options.discover();const baseArch={components:urvArray((options.baseline||snapshot).architecture?.components||(options.baseline||snapshot).components)};const postArch={components:urvArray(postSnapshot?.architecture?.components||postSnapshot?.components)};if(typeof ua2ArchitectureDiff==='function')architectureDiff=ua2ArchitectureDiff(baseArch,postArch);}catch(e){postSnapshotError=urvRedact(e?.message||String(e));}}return{available:true,version:UNIVERSAL_RUNTIME_VERIFICATION_VERSION,status:failed.length?'failed':'passed',classification:firstFailure?urvFailureClass(firstFailure):null,summary:{executedPhases:phases.length,failedPhases:failed.length,runtimeStarted,observedPorts:ports,apiChecks:health.length,retriesUsed:phases.reduce((n,p)=>n+Math.max(0,(p.evidence?.attempt||1)-1),0)},phases,healthChecks:health,runtimeLog,postSnapshot,postSnapshotError,architectureDiff,repair:{required:Boolean(firstFailure),rootCauseClass:firstFailure?urvFailureClass(firstFailure):null,action:firstFailure?'Repair the first failing layer using the captured empirical output, then rerun runtime verification.':'No repair required.'},capability:'empirical-runtime-execution'};}

async function runClosedRuntimeRepairLoop(options={}){const maxRepairAttempts=Math.max(0,Number(options.maxRepairAttempts??2));let currentSnapshot=options.snapshot||{};const baseline=options.baseline||currentSnapshot;const attempts=[];for(let i=0;i<=maxRepairAttempts;i++){const verification=await runUniversalRuntimeVerification({...options,snapshot:currentSnapshot,baseline,autoRepair:false});attempts.push({attempt:i+1,verification});if(verification.status==='passed')return{...verification,closedRepairLoop:{enabled:true,status:'recovered',repairAttempts:i,attempts}};if(i===maxRepairAttempts||typeof options.repair!=='function')return{...verification,closedRepairLoop:{enabled:true,status:'exhausted',repairAttempts:i,attempts,finalFailure:verification.classification}};let repairResult;try{repairResult=await options.repair({attempt:i+1,environment:options.environment||'Unknown',root:options.root||currentSnapshot.root||'.',snapshot:currentSnapshot,baseline,failure:verification});}catch(e){repairResult={applied:false,error:urvRedact(e?.message||String(e))};}attempts[attempts.length-1].repair=repairResult;if(!repairResult?.applied)return{...verification,closedRepairLoop:{enabled:true,status:'repair-declined',repairAttempts:i,attempts,repairError:repairResult?.error||'Repair callback did not apply a change.'}};if(typeof options.discover==='function'){try{currentSnapshot=await options.discover();}catch(e){return{...verification,closedRepairLoop:{enabled:true,status:'rescan-failed',repairAttempts:i+1,attempts,rescanError:urvRedact(e?.message||String(e))}};}}else currentSnapshot={...currentSnapshot,repairResult};}return{available:false,version:UNIVERSAL_RUNTIME_VERIFICATION_VERSION,error:'Closed repair loop terminated unexpectedly.'};}
'''

          for target in [engine, Path('Mastermind_Desktop/universal_runtime_verification_engine.js')]:
              s = text if target == engine else Path('Mastermind_Desktop/universal_runtime_verification_engine.js').read_text()
              st = s.index('async function runUniversalRuntimeVerification(options={})')
              en = s.index("if(typeof module!=='undefined')module.exports=", st)
              s = s[:st] + replacement + "\n" + s[en:]
              s = s.replace("if(typeof module!=='undefined')module.exports={UNIVERSAL_RUNTIME_VERIFICATION_VERSION,runUniversalRuntimeVerification,urvFailureClass,urvCommands};", "if(typeof module!=='undefined')module.exports={UNIVERSAL_RUNTIME_VERIFICATION_VERSION,runUniversalRuntimeVerification,runClosedRuntimeRepairLoop,urvFailureClass,urvCommands};")
              target.write_text(s)

          def patch_core(path, desktop=False):
              p = Path(path)
              s = p.read_text()
              old = 'toolResult = await runUniversalRuntimeVerification({'
              new = 'toolResult = await runClosedRuntimeRepairLoop({'
              if old not in s:
                  raise SystemExit(f'Runtime call marker missing: {path}')
              s = s.replace(old, new, 1)
              marker = '                        discover: async () => performCloudArchitectureDiscovery(runtimeRoot)\n                    });' if not desktop else '                        discover: async () => performArchitectureDiscovery(runtimeRoot)\n                    });'
              if marker not in s:
                  raise SystemExit(f'Discover marker missing: {path}')
              callback = '''                        repair: async ({ failure, snapshot }) => {
                            const repairPrompt = `You are the bounded autonomous repair agent. Repair ONLY the root cause evidenced by the runtime verification. Do not redesign unrelated code. Do not call runtime_verify. Use read_file/analyze_file first, then the smallest safe write/replace operation. Return tool calls, not prose. Runtime evidence: ${JSON.stringify(failure).slice(-14000)}`;
                            const repairResponse = await callAiBrain([{ role: 'user', parts: [{ text: repairPrompt }] }]);
                            const calls = repairResponse?.candidates?.[0]?.content?.parts?.filter(p => p.functionCall) || [];
                            let applied = false;
                            const results = [];
                            for (const part of calls.slice(0, 4)) {
                                const { name, args } = part.functionCall;
                                if (!["read_file", "write_file", "replace_file_content", "analyze_file", "run_terminal_command"].includes(name)) continue;
                                if (name === "run_terminal_command" && /(^|[;&|])(del|erase|rm|rmdir|remove-item|format|diskpart|shutdown|stop-computer|restart-computer)\b/i.test(args?.command || '')) continue;
                                let result;
                                if (name === "read_file") result = await %READ%(args);
                                else if (name === "analyze_file") result = await %READ%(args);
                                else if (name === "write_file") result = await %WRITE%(args);
                                else if (name === "replace_file_content") result = await %REPLACE%(args);
                                else if (name === "run_terminal_command") result = await callLocalBridge('cmd', args);
                                results.push({ name, result });
                                if (!["read_file", "analyze_file"].includes(name) && result && !String(result).includes('❌')) applied = true;
                            }
                            return { applied, results, callCount: calls.length };
                        },
''' 
              if desktop:
                  callback = callback.replace('%READ%', "callLocalBridge('read', args)").replace('%WRITE%', "callLocalBridge('write', args)").replace('%REPLACE%', "(async a => { const current = await callLocalBridge('read', { path: a.path }); const content = current?.content ?? current?.output ?? current; if (typeof content !== 'string' || !content.includes(a.targetContent)) return '❌ target not found'; return await callLocalBridge('write', { path: a.path, content: content.replace(a.targetContent, a.replacementContent) }); })(args)")
              else:
                  callback = callback.replace('%READ%', "getGithubFileContent(normalizePathForCloud(args.path))").replace('%WRITE%', "writeFile(normalizePathForCloud(args.path), args.content)").replace('%REPLACE%', "replaceFileContent(normalizePathForCloud(a.path), a.targetContent, a.replacementContent)")
              s = s.replace(marker, callback + marker)
              s = s.replace('maxRetries: Number.isInteger(args?.maxRetries) ? args.maxRetries : 1,', 'maxRetries: Number.isInteger(args?.maxRetries) ? args.maxRetries : 1,\n                        maxRepairAttempts: 2,')
              p.write_text(s)

          patch_core('my_AI/ai_engine_core.js', desktop=False)
          patch_core('Mastermind_Desktop/core.js', desktop=True)
          PY

          node --check my_AI/universal_runtime_verification_engine.js
          node --check Mastermind_Desktop/universal_runtime_verification_engine.js
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js

          rm -f .github/workflows/close_runtime_repair_loop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add my_AI/universal_runtime_verification_engine.js Mastermind_Desktop/universal_runtime_verification_engine.js my_AI/ai_engine_core.js Mastermind_Desktop/core.js .github/workflows
          git commit -m 'Close autonomous runtime repair loop'
          git push
