name: verify-runtime-verified
on:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check my_AI/universal_skill_runtime_verifier_engine.js
          node --check my_AI/universal_skill_execution_adapter.js
          node --check my_AI/universal_skill_execution_sandbox_engine.js
          node --check my_AI/universal_skill_benchmark_runner_engine.js
          node --check Mastermind_Desktop/universal_skill_execution_adapter.js
          node --check Mastermind_Desktop/universal_skill_execution_sandbox_engine.js
          node --check Mastermind_Desktop/universal_skill_benchmark_runner_engine.js
      - name: Docker runtime verification
        run: |
          node - <<'NODE'
          const a = require('./my_AI/universal_skill_execution_adapter.js');
          (async()=>{
            const r = await a.verifyRuntime({workingDirectory:process.cwd(),timeoutMs:5000,maxMemoryMb:256,maxCpus:1,maxProcesses:64});
            console.log(JSON.stringify(r,null,2));
            if (!r.verified) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(3);});
          NODE
      - name: Desktop runtime verification policy check
        run: |
          node - <<'NODE'
          const a = require('./Mastermind_Desktop/universal_skill_execution_adapter.js');
          (async()=>{
            const r = await a.verifyRuntime({workingDirectory:process.cwd(),timeoutMs:1500});
            console.log(JSON.stringify(r,null,2));
            if (r.verified !== false || r.status !== 'partial') process.exit(4);
          })().catch(e=>{console.error(e);process.exit(5);});
          NODE
