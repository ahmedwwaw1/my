name: Bridge Skill Execution Sandbox
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate Universal Skill Execution Sandbox') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrate and verify
        run: |
          node .github/bridge_skill_execution_sandbox.js
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
          node --check my_AI/universal_skill_execution_sandbox_engine.js
          node --check Mastermind_Desktop/universal_skill_execution_sandbox_engine.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js
          git commit -m 'Integrate Universal Skill Execution Sandbox'
          git rm .github/bridge_skill_execution_sandbox.js .github/workflows/bridge_skill_execution_sandbox.yml
          git commit --amend --no-edit
          git push
