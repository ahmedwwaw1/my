name: Run Agent Operating Loop Upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adapt upgrader for desktop layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/upgrade_agent_operating_loop.js')
          s=p.read_text()
          old="""  const anchor=s.includes('async function callAiBrain(history)')?'async function callAiBrain(history)':(s.includes('async function callAiBrain')?'async function callAiBrain':null);"""
          new="""  const anchor=s.includes('async function callAiBrain(history)')?'async function callAiBrain(history)':(s.includes('async function callAiBrain')?'async function callAiBrain':(s.includes('async function runToolLoop(history)')?'async function runToolLoop(history)':null));"""
          if old not in s: raise SystemExit('anchor patch target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Apply upgrade
        run: node scripts/upgrade_agent_operating_loop.js
      - name: Verify syntax
        run: |
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/upgrade_agent_operating_loop.js .github/workflows/run_agent_operating_loop_upgrade.yml
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js scripts/upgrade_agent_operating_loop.js .github/workflows/run_agent_operating_loop_upgrade.yml
          git commit -m 'Upgrade architecture loop to closed agent operating loop'
          git push
