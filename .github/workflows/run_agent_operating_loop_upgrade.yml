name: Run Agent Operating Loop Upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('scripts/upgrade_agent_operating_loop.js').read_text()
          helper=src.split('const helper=String.raw`',1)[1].split('`;\nfor(const file of files)',1)[0]
          files=['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']
          for file in files:
              p=Path(file); s=p.read_text()
              if 'UNIVERSAL_AGENT_OPERATING_LOOP_VERSION' not in s:
                  anchor='async function callAiBrain(history)' if 'async function callAiBrain(history)' in s else ('async function callAiBrain' if 'async function callAiBrain' in s else 'async function runToolLoop(history)')
                  if anchor not in s: raise SystemExit(f'{file}: no insertion anchor')
                  s=s.replace(anchor,helper+'\n'+anchor,1)
              start=-1
              for marker in ['else if (name === "architecture_loop")','else if (name === \'architecture_loop\')']:
                  start=s.find(marker)
                  if start>=0: break
              if start<0: raise SystemExit(f'{file}: architecture_loop start not found')
              tail=re.search(r'\n\s*else if ',s[start+1:])
              if not tail: raise SystemExit(f'{file}: architecture_loop next branch not found')
              end=start+1+tail.start()
              indent=re.match(r'\s*',s[start:]).group(0)
              env='Windows Desktop' if 'Mastermind_Desktop' in file else 'GitHub Cloud'
              branch=(f'else if (name === "architecture_loop") {{\n{indent}    try {{\n{indent}        toolResult = await runUniversalAgentOperatingLoop({{ environment: "{env}", root: safePath || "", objective: args?.objective || "", constraints: args?.constraints || {{}}, verify: true, maxRepairAttempts: 2 }});\n{indent}    }} catch (e) {{\n{indent}        toolResult = {{ error: "Universal agent operating loop failed.", details: e?.message || String(e) }};\n{indent}    }}\n{indent}}}')
              s=s[:start]+branch+s[end:]
              defs=len(re.findall(r'const UNIVERSAL_AGENT_OPERATING_LOOP_VERSION\s*=',s))
              if defs!=1: raise SystemExit(f'{file}: version definition count {defs}')
              p.write_text(s)
          print('Agent Operating Loop patched in both cores.')
          PY
      - name: Verify syntax and wiring
        run: |
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
          node <<'NODE'
          const fs=require('fs');
          for(const f of ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']){
            const s=fs.readFileSync(f,'utf8');
            if(!s.includes('async function runUniversalAgentOperatingLoop'))throw new Error(f+': loop function missing');
            if((s.match(/const UNIVERSAL_AGENT_OPERATING_LOOP_VERSION\s*=/g)||[]).length!==1)throw new Error(f+': loop definition count invalid');
            if(!s.includes('toolResult = await runUniversalAgentOperatingLoop'))throw new Error(f+': architecture tool wiring missing');
          }
          console.log('Static operating-loop verification passed.');
          NODE
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/upgrade_agent_operating_loop.js .github/workflows/run_agent_operating_loop_upgrade.yml
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js scripts/upgrade_agent_operating_loop.js .github/workflows/run_agent_operating_loop_upgrade.yml
          git commit -m 'Upgrade architecture loop to closed agent operating loop'
          git push
