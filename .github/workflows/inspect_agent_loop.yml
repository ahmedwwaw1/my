name: Inspect agent loop
on:
  push:
    paths:
      - '.github/workflows/inspect_agent_loop.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect helper
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']) {
            const s = fs.readFileSync(file,'utf8');
            const marker = 'async function runUniversalAgentOperatingLoop';
            const start = s.indexOf(marker);
            if (start < 0) throw new Error(`missing helper in ${file}`);
            const open = s.indexOf('{', start);
            let depth = 0, end = -1, inStr = null, esc = false, inLine = false, inBlock = false;
            for (let i=open;i<s.length;i++) {
              const c=s[i], n=s[i+1];
              if (inLine) { if(c==='\n') inLine=false; continue; }
              if (inBlock) { if(c==='*'&&n==='/'){inBlock=false;i++;} continue; }
              if (inStr) { if(esc){esc=false;continue;} if(c==='\\'){esc=true;continue;} if(c===inStr)inStr=null; continue; }
              if(c==='/'&&n==='/'){inLine=true;i++;continue;}
              if(c==='/'&&n==='*'){inBlock=true;i++;continue;}
              if(c==='\''||c==='"'||c==='`'){inStr=c;continue;}
              if(c==='{')depth++;
              else if(c==='}'&&--depth===0){end=i+1;break;}
            }
            console.log(`---BEGIN ${file}---`);
            console.log(s.slice(start,end));
            console.log(`---END ${file}---`);
          }
          NODE
