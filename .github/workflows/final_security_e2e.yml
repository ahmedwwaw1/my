name: Final Security and E2E Verification
on:
  push:
    paths:
      - '.github/workflows/final_security_e2e.yml'
      - 'my_AI/ai_engine_core.js'
      - 'Mastermind_Desktop/core.js'
      - 'index.html'
      - 'Mastermind_Desktop/index.html'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove embedded service credential
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s,n=re.subn(r"^const SUPABASE_KEY\s*=.*;\s*$", "const SUPABASE_KEY = (typeof window !== 'undefined' && typeof window.__SUPABASE_PUBLIC_KEY__ === 'string') ? window.__SUPABASE_PUBLIC_KEY__ : '';", s, count=1, flags=re.M)
              if n != 1: raise SystemExit(f'{name}: SUPABASE_KEY declaration not found')
              s=s.replace("'Authorization': `Bearer ${SUPABASE_KEY}`,\n                'apikey': SUPABASE_KEY\n", "...(SUPABASE_KEY ? {\n                'Authorization': `Bearer ${SUPABASE_KEY}`,\n                'apikey': SUPABASE_KEY\n            } : {})\n")
              p.write_text(s,encoding='utf-8')
          Path('my_AI/security_config.js').write_text("/* Public/anon configuration only. Never store service-role credentials here. */\nwindow.__SUPABASE_PUBLIC_KEY__ = window.__SUPABASE_PUBLIC_KEY__ || '';\n",encoding='utf-8')
          Path('Mastermind_Desktop/security_config.js').write_text("/* Public/anon configuration only. Never store service-role credentials here. */\nwindow.__SUPABASE_PUBLIC_KEY__ = window.__SUPABASE_PUBLIC_KEY__ || '';\n",encoding='utf-8')
          PY
      - name: Wire security config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'my_AI/security_config.js' not in s:
              s=s.replace('<script src="my_AI/ai_engine_core.js?v=2026.2"></script>', '<script src="my_AI/security_config.js?v=2026.3"></script>\n    <script src="my_AI/ai_engine_core.js?v=2026.3"></script>',1)
          p.write_text(s,encoding='utf-8')
          p=Path('Mastermind_Desktop/index.html'); s=p.read_text(encoding='utf-8')
          if 'security_config.js' not in s:
              s=s.replace('<!-- <script src="logic.js"></script> -->','<!-- <script src="logic.js"></script> -->\n    <script src="security_config.js?v=2026.3"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Static security and syntax gate
        run: |
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
          node --check my_AI/evidence_operating_loop_adapter.js
          node --check Mastermind_Desktop/evidence_operating_loop_adapter.js
          if grep -R -n -E 'service_role|SUPABASE_KEY[[:space:]]*=[[:space:]]*['"']eyJ' my_AI Mastermind_Desktop; then
            echo 'Embedded service-role credential still present'; exit 1
          fi
      - name: Agent loop E2E harness
        run: |
          mkdir -p scripts
          cat > scripts/final_e2e.js <<'NODE'
          const fs=require('fs'), vm=require('vm'), assert=require('assert');
          const base={console,Date,JSON,Math,Promise,String,Number,Boolean,Array,Object,Set,Map,encodeURIComponent,decodeURIComponent,escape,unescape,btoa:s=>Buffer.from(s,'binary').toString('base64'),atob:s=>Buffer.from(s,'base64').toString('binary'),setInterval:()=>0,clearInterval:()=>{},setTimeout,clearTimeout,fetch:async()=>({ok:true,status:200,json:async()=>({}),text:async()=>''})};
          base.localStorage={getItem:()=>null,setItem:()=>{},removeItem:()=>{}};
          base.document={getElementById:()=>({value:'gemini-2.5-flash',classList:{add:()=>{},remove:()=>{},contains:()=>false},style:{},innerHTML:'',appendChild:()=>{},scrollTop:0,scrollHeight:0}),querySelector:()=>null};
          base.window=base;base.window.addEventListener=()=>{};base.logToTerminal=()=>{};
          async function run(env,core,engine,adapter){const c={...base};c.window=c;const ctx=vm.createContext(c);vm.runInContext(fs.readFileSync(core,'utf8'),ctx,{filename:core});const discovery=async()=>({root:'.',summary:{totalFiles:3},project:{name:'e2e'},architecture:{components:[{path:'app.js',role:'Logic',localDependencies:[],externalDependencies:[]}],relations:[],layers:{Logic:['app.js']},externalDependencies:[],electron:{detected:env==='Windows Desktop',ipcChannels:[],bridgeFiles:[]}}});ctx.performCloudArchitectureDiscovery=discovery;ctx.performArchitectureDiscovery=discovery;ctx.getGithubFileContent=async()=> 'original';ctx.listGithubFiles=async()=> 'app.js';ctx.callLocalBridge=async(action)=>action==='cmd'?'search-ok':action==='read'?'original':action==='write'?'written':'listed';const writes=[];ctx.writeFile=async(path,content)=>{writes.push({path,content});return '✅ written';};ctx.replaceFileContent=async()=> '✅ replaced';ctx.searchCode=async()=> 'search-ok';let n=0;ctx.callAiBrain=async()=>{n++;return n===1?{candidates:[{content:{parts:[{functionCall:{name:'fast_file_search',args:{query:'app.js'}}},{functionCall:{name:'write_file',args:{path:'app.js',content:'updated'}}}]}}]}:{candidates:[{content:{parts:[{text:'done'}]}}]}};ctx.runClosedRuntimeRepairLoop=async()=>({status:'passed'});vm.runInContext(fs.readFileSync(engine,'utf8'),ctx,{filename:engine});vm.runInContext(fs.readFileSync(adapter,'utf8'),ctx,{filename:adapter});const result=await ctx.runUniversalAgentOperatingLoop({environment:env,root:'.',objective:'E2E mission',verify:true});assert.equal(result.available,true);assert.equal(result.success,true);assert.equal(result.acceptance.verdict,'accepted');assert.equal(result.implementation.changed,true);assert.ok(result.evidence.some(x=>x.phase==='verification'));assert.ok(writes.length>0);return{env,verdict:result.acceptance.verdict,writes:writes.length,turns:n};}
          Promise.all([run('GitHub Cloud','my_AI/ai_engine_core.js','my_AI/universal_evidence_engine.js','my_AI/evidence_operating_loop_adapter.js'),run('Windows Desktop','Mastermind_Desktop/core.js','Mastermind_Desktop/universal_evidence_engine.js','Mastermind_Desktop/evidence_operating_loop_adapter.js')]).then(r=>console.log(JSON.stringify(r))).catch(e=>{console.error(e);process.exit(1)});
          NODE
          node scripts/final_e2e.js
      - name: Desktop real startup smoke test
        run: |
          cd Mastermind_Desktop
          npm ci --ignore-scripts
          npx electron --version
          timeout 20s xvfb-run -a npx electron . > /tmp/mastermind-electron.log 2>&1 || rc=$?
          if [ "${rc:-0}" != "124" ] && [ "${rc:-0}" != "0" ]; then cat /tmp/mastermind-electron.log; exit "${rc}"; fi
          tail -n 80 /tmp/mastermind-electron.log || true
      - name: Commit security fix and clean test files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/final_e2e.js .github/workflows/final_security_e2e.yml
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js my_AI/security_config.js Mastermind_Desktop/security_config.js index.html Mastermind_Desktop/index.html .github/workflows/final_security_e2e.yml
          git commit -m 'Remove embedded service credential and verify agent end-to-end'
          git push
