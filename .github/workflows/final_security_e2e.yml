name: Final Security and E2E Verification
on:
  push:
    paths:
      - '.github/workflows/final_security_e2e.yml'
      - 'my_AI/ai_engine_core.js'
      - 'Mastermind_Desktop/core.js'
      - 'index.html'
      - 'Mastermind_Desktop/index.html'
      - 'my_AI/chat_logs.json'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove embedded credentials from current tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text_ext={'.js','.json','.md','.html','.css','.yml','.yaml','.txt'}
          jwt=re.compile(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+')
          for p in [p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix.lower() in text_ext]:
              s=p.read_text(encoding='utf-8',errors='ignore'); original=s
              if p.name in {'ai_engine_core.js','core.js'}:
                  s=re.sub(r"^const SUPABASE_KEY\s*=.*;\s*$", "const SUPABASE_KEY = (typeof window !== 'undefined' && typeof window.__SUPABASE_PUBLIC_KEY__ === 'string') ? window.__SUPABASE_PUBLIC_KEY__ : '';", s, count=1, flags=re.M)
              s=jwt.sub('[REDACTED_JWT]',s)
              if s!=original: p.write_text(s,encoding='utf-8')
          PY
      - name: Wire security config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'my_AI/security_config.js' not in s:
              s=s.replace('<script src="my_AI/ai_engine_core.js?v=2026.2"></script>','<script src="my_AI/security_config.js?v=2026.3"></script>\n    <script src="my_AI/ai_engine_core.js?v=2026.3"></script>',1)
          p.write_text(s,encoding='utf-8')
          p=Path('Mastermind_Desktop/index.html'); s=p.read_text(encoding='utf-8')
          if 'security_config.js' not in s:
              s=s.replace('<!-- <script src="logic.js"></script> -->','<!-- <script src="logic.js"></script> -->\n    <script src="security_config.js?v=2026.3"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Static security and syntax gate
        run: |
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
          node --check my_AI/evidence_operating_loop_adapter.js
          node --check Mastermind_Desktop/evidence_operating_loop_adapter.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          jwt=re.compile(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+')
          bad=[]
          for root in (Path('my_AI'),Path('Mastermind_Desktop')):
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.js','.json','.md','.html','.css','.yml','.yaml','.txt'}:
                      s=p.read_text(encoding='utf-8',errors='ignore')
                      if jwt.search(s): bad.append(str(p))
                      if p.name in {'ai_engine_core.js','core.js'} and re.search(r"const SUPABASE_KEY\s*=\s*['\"]eyJ",s): bad.append(str(p)+':embedded-key')
          if bad:
              print('Credential-like JWT remains:',bad); raise SystemExit(1)
          print('Static security and syntax gate passed.')
          PY
      - name: Agent loop E2E harness
        run: |
          mkdir -p scripts
          cat > scripts/final_e2e.js <<'NODE'
          const fs=require('fs'), vm=require('vm'), assert=require('assert');
          const base={console,Date,JSON,Math,Promise,String,Number,Boolean,Array,Object,Set,Map,encodeURIComponent,decodeURIComponent,escape,unescape,btoa:s=>Buffer.from(s,'binary').toString('base64'),atob:s=>Buffer.from(s,'base64').toString('binary'),setInterval:()=>0,clearInterval:()=>{},setTimeout,clearTimeout,fetch:async()=>({ok:true,status:200,json:async()=>({}),text:async()=>''})};
          base.localStorage={getItem:()=>null,setItem:()=>{},removeItem:()=>{}};
          base.document={getElementById:()=>({value:'gemini-2.5-flash',classList:{add:()=>{},remove:()=>{},contains:()=>false},style:{},innerHTML:'',appendChild:()=>{},scrollTop:0,scrollHeight:0}),querySelector:()=>null};
          base.window=base;base.window.addEventListener=()=>{};base.logToTerminal=()=>{};
          async function run(env,core,engine,adapter){
            const c={...base}; c.window=c; const ctx=vm.createContext(c);
            vm.runInContext(fs.readFileSync(core,'utf8'),ctx,{filename:core});
            const discovery=async()=>({root:'.',summary:{totalFiles:3},project:{name:'e2e'},architecture:{components:[{path:'app.js',role:'Logic',localDependencies:[],externalDependencies:[]}],relations:[],layers:{Logic:['app.js']},externalDependencies:[],electron:{detected:env==='Windows Desktop',ipcChannels:[],bridgeFiles:[]}}});
            ctx.performCloudArchitectureDiscovery=discovery; ctx.performArchitectureDiscovery=discovery;
            ctx.getGithubFileContent=async()=> 'original'; ctx.listGithubFiles=async()=> 'app.js';
            let bridgeWrites=0;
            ctx.callLocalBridge=async(action)=>{if(action==='cmd')return 'search-ok'; if(action==='read')return 'original'; if(action==='write'){bridgeWrites++;return 'written';} return 'listed';};
            let cloudWrites=0;
            ctx.writeFile=async()=>{cloudWrites++;return '✅ written';};
            ctx.replaceFileContent=async()=> '✅ replaced'; ctx.searchCode=async()=> 'search-ok';
            let n=0;
            ctx.callAiBrain=async()=>{n++;return n===1?{candidates:[{content:{parts:[{functionCall:{name:'fast_file_search',args:{query:'app.js'}}},{functionCall:{name:'write_file',args:{path:'app.js',content:'updated'}}}]}}]}:{candidates:[{content:{parts:[{text:'done'}]}}]}};
            ctx.runClosedRuntimeRepairLoop=async()=>({status:'passed'});
            vm.runInContext(fs.readFileSync(engine,'utf8'),ctx,{filename:engine});
            vm.runInContext(fs.readFileSync(adapter,'utf8'),ctx,{filename:adapter});
            const result=await ctx.runUniversalAgentOperatingLoop({environment:env,root:'.',objective:'E2E mission',verify:true});
            assert.equal(result.available,true); assert.equal(result.success,true); assert.equal(result.acceptance.verdict,'accepted'); assert.equal(result.implementation.changed,true); assert.ok((cloudWrites+bridgeWrites)>0);
            return{env,verdict:result.acceptance.verdict,writes:cloudWrites+bridgeWrites,turns:n};
          }
          Promise.all([run('GitHub Cloud','my_AI/ai_engine_core.js','my_AI/universal_evidence_engine.js','my_AI/evidence_operating_loop_adapter.js'),run('Windows Desktop','Mastermind_Desktop/core.js','Mastermind_Desktop/universal_evidence_engine.js','Mastermind_Desktop/evidence_operating_loop_adapter.js')]).then(r=>{console.log(JSON.stringify(r));}).catch(e=>{console.error(e);process.exit(1)});
          NODE
          node scripts/final_e2e.js
      - name: Desktop real startup smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          cd Mastermind_Desktop
          npm ci
          npx electron --version
          timeout 20s xvfb-run -a npx electron . > /tmp/mastermind-electron.log 2>&1 || rc=$?
          if [ "${rc:-0}" != "124" ] && [ "${rc:-0}" != "0" ]; then cat /tmp/mastermind-electron.log; exit "${rc}"; fi
          tail -n 80 /tmp/mastermind-electron.log || true
      - name: Commit security fix and clean test files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/final_e2e.js .github/workflows/final_security_e2e.yml
          git add -A my_AI Mastermind_Desktop index.html .github/workflows/final_security_e2e.yml
          git commit -m 'Remove embedded credentials and verify agent end-to-end'
          git push
