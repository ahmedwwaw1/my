name: Fix Skill Dispatch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire skill manager into tool loops
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          for(const path of ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']){
            let s=fs.readFileSync(path,'utf8');
            const li=s.indexOf('async function runToolLoop');
            if(li<0) throw new Error(`runToolLoop not found in ${path}`);
            const fi=s.indexOf('else toolResult =',li);
            if(fi<0) throw new Error(`fallback branch not found in ${path}`);
            const semi=s.indexOf(';',fi);
            if(semi<0) throw new Error(`fallback terminator not found in ${path}`);
            const before=s.slice(Math.max(0,fi-120),fi);
            if(!before.includes('name === "skill_manager"') && !s.slice(fi,Math.min(s.length,fi+500)).includes('name === "skill_manager"')){
              const old=s.slice(fi,semi+1);
              const tail=old.slice('else '.length);
              const replacement=`else if (name === "skill_manager") toolResult = await universalSkillManager(args?.action || "list", args || {}, {\n                    fetchText: async ({repository,path,ref}) => {\n                        const endpoint = \`https://api.github.com/repos/\${repository}/contents/\${path}?ref=\${encodeURIComponent(ref || "main")}\`;\n                        const data = await callBridge("github", { endpoint, method: "GET" });\n                        const raw = data?.content ? atob(String(data.content).replace(/\\s/g, "")) : (typeof data === "string" ? data : JSON.stringify(data));\n                        try { return decodeURIComponent(escape(raw)); } catch (_) { return raw; }\n                    },\n                    readText: async filePath => {\n                        if (typeof getGithubFileContent === "function") return await getGithubFileContent(filePath);\n                        if (typeof callLocalBridge === "function") return await callLocalBridge("read", { path: filePath });\n                        return "";\n                    }\n                }); ${tail}`;
              s=s.slice(0,fi)+replacement+s.slice(semi+1);
            }
            fs.writeFileSync(path,s);
          }
          NODE
      - name: Syntax gate
        run: |
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
          node --check my_AI/universal_skill_system.js
          node --check Mastermind_Desktop/universal_skill_system.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix_skill_dispatch.yml
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js my_AI/universal_skill_system.js Mastermind_Desktop/universal_skill_system.js
          git commit -m "Wire Universal Skill System into agent tool dispatch"
          git push origin HEAD:main
