name: Upgrade Cloud Discovery Scan

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch ai_engine_core.js
        shell: python
        run: |
          from pathlib import Path

          core_path = Path("my_AI/ai_engine_core.js")
          engine_path = Path("my_AI/discovery_scan_engine.js")

          core = core_path.read_text(encoding="utf-8")
          engine = engine_path.read_text(encoding="utf-8")

          if "const CLOUD_ARCH_SCAN_LIMITS" not in core:
              marker = "// --- [AI Engine Logic] ---"
              if marker not in core:
                  raise SystemExit("AI Engine Logic marker not found")
              core = core.replace(marker, "// --- [Cloud Architecture Discovery Engine v4.0] ---\n" + engine + "\n\n" + marker, 1)

          old = '''else if (name === "discovery_scan") {\n                    const files = await listGithubFiles(args.path || "");\n                    toolResult = {\n                        structure: files,\n                        indicators: "GitHub Sovereign Repository",\n                        recommendation: "Use Engineering Intuition to map components."\n                    };\n                }'''

          new = '''else if (name === "discovery_scan") {\n                    try {\n                        toolResult = await performCloudArchitectureDiscovery(safePath || "");\n                    } catch (scanError) {\n                        toolResult = {\n                            error: "Cloud discovery scan failed.",\n                            details: scanError?.message || String(scanError),\n                            fallback: await listGithubFiles(safePath || "")\n                        };\n                    }\n                }'''

          if old in core:
              core = core.replace(old, new, 1)
          elif new not in core:
              raise SystemExit("Original discovery_scan implementation not found")

          core_path.write_text(core, encoding="utf-8", newline="\n")

      - name: Validate JavaScript structure
        run: |
          node --check my_AI/ai_engine_core.js
          node --check my_AI/discovery_scan_engine.js

      - name: Commit upgrade and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_AI/ai_engine_core.js
          git rm .github/workflows/upgrade_cloud_discovery_scan.yml
          git commit -m "Upgrade cloud discovery_scan integration"
          git push
