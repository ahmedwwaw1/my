name: Verify Skill Execution Adapters
on:
  push:
    branches: [main]
jobs:
  verify:
    if: !contains(github.event.head_commit.message, 'Finalize Skill Execution Adapters')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify syntax
        run: |
          node --check my_AI/universal_skill_execution_adapter.js
          node --check Mastermind_Desktop/universal_skill_execution_adapter.js
          node --check my_AI/universal_skill_execution_sandbox_engine.js
          node --check Mastermind_Desktop/universal_skill_execution_sandbox_engine.js
      - name: Verify adapters
        run: node .github/verify_skill_execution_adapters.js
      - name: Finalize and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/verify_skill_execution_adapters.js .github/workflows/verify_skill_execution_adapters.yml
          git commit -m 'Finalize Skill Execution Adapters'
          git push
