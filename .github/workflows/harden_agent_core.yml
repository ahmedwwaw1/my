name: Harden Agent Core
on:
  push:
    paths:
      - '.github/workflows/harden_agent_core.yml'
      - 'my_AI/ai_engine_core.js'
      - 'Mastermind_Desktop/core.js'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch core files safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']
          for file in files:
              p=Path(file); s=p.read_text(encoding='utf-8')
              # fast_file_search dispatch
              marker="if(name==='read_file'||name==='analyze_file')result="
              if marker in s and "else if(name==='fast_file_search')" not in s[s.find('async function runUniversalAgentOperatingLoop'):s.find('async function callAiBrain') if 'async function callAiBrain' in s else len(s)]:
                  branch="else if(name==='fast_file_search'){result=typeof callLocalBridge==='function'?await callLocalBridge('cmd',{command:'es.exe -d \"'+String(args.query||'')+'\"'}):{error:'fast_file_search unavailable'};}\n   "
                  s=s.replace(marker,branch+marker,1)
              # successful write proof
              s=s.replace("result=typeof writeFile==='function'?await writeFile(path,args.content||'','Universal Agent Operating Loop implementation'):await callLocalBridge('write',{path,content:args.content||''});changed=true;","result=typeof writeFile==='function'?await writeFile(path,args.content||'','Universal Agent Operating Loop implementation'):await callLocalBridge('write',{path,content:args.content||''});if(!result||result.error||(typeof result==='string'&&/^(❌|error|failed)/i.test(result)))throw new Error('write_file failed: '+(typeof result==='string'?result:JSON.stringify(result)));changed=true;")
              # safe surgical replacement fallback
              old="result=typeof replaceFileContent==='function'?await replaceFileContent(path,args.targetContent||'',args.replacementContent||''):await callLocalBridge('write',{path,content:args.replacementContent||''});changed=true;"
              new="if(typeof replaceFileContent==='function'){result=await replaceFileContent(path,args.targetContent||'',args.replacementContent||'');}else{let current=typeof getGithubFileContent==='function'?await getGithubFileContent(path):await callLocalBridge('read',{path});if(current&&typeof current==='object'&&current.content)current=current.content;if(typeof current!=='string'||!current.includes(args.targetContent||''))throw new Error('replace_file_content target not found');const updated=current.replace(args.targetContent||'',args.replacementContent||'');result=typeof writeFile==='function'?await writeFile(path,updated,'Universal Agent Operating Loop surgical replacement'):await callLocalBridge('write',{path,content:updated});}if(!result||result.error||(typeof result==='string'&&/^(❌|error|failed)/i.test(result)))throw new Error('replace_file_content failed: '+(typeof result==='string'?result:JSON.stringify(result)));changed=true;"
              s=s.replace(old,new)
              # safe multi replace fallback
              old2="else {let current=typeof getGithubFileContent==='function'?await getGithubFileContent(path):await callLocalBridge('read',{path});if(current&&typeof current==='object'&&current.content)current=current.content;let updated=String(current||'');for(const r of (args.replacements||[]))if(updated.includes(r.targetContent))updated=updated.replace(r.targetContent,r.replacementContent);result=typeof writeFile==='function'?await writeFile(path,updated,'Universal Agent Operating Loop batch'):await callLocalBridge('write',{path,content:updated});changed=true;}"
              new2="else{let current=typeof getGithubFileContent==='function'?await getGithubFileContent(path):await callLocalBridge('read',{path});if(current&&typeof current==='object'&&current.content)current=current.content;if(typeof current!=='string')throw new Error('multi_replace_file_content could not read target file');let updated=current,matched=0;for(const r of(args.replacements||[])){if(updated.includes(r.targetContent)){updated=updated.replace(r.targetContent,r.replacementContent);matched++;}}if(!matched)throw new Error('multi_replace_file_content: none of the targets matched');result=typeof writeFile==='function'?await writeFile(path,updated,'Universal Agent Operating Loop batch'):await callLocalBridge('write',{path,content:updated});if(!result||result.error||(typeof result==='string'&&/^(❌|error|failed)/i.test(result)))throw new Error('multi_replace_file_content write failed: '+(typeof result==='string'?result:JSON.stringify(result)));changed=true;}"
              s=s.replace(old2,new2)
              # desktop path normalizer
              if file.startswith('Mastermind_Desktop/') and 'function normalizePathForCloud(path)' not in s:
                  anchor='async function runUniversalAgentOperatingLoop(options={})'
                  if anchor not in s: raise SystemExit(file+': loop anchor missing')
                  helper="function normalizePathForCloud(path){if(!path)return '';return String(path).replace(/^[a-zA-Z]:\\\\[^\\\\]+\\\\[^\\\\]+\\\\my\\\\/i,'').replace(/^my[\\\\/]/i,'').replace(/\\\\/g,'/');}\n\n"
                  s=s.replace(anchor,helper+anchor,1)
              # remove service role credential
              s,n=re.subn(r"^const SUPABASE_KEY\s*=.*;\n","const SUPABASE_KEY = (typeof window !== 'undefined' && typeof window.__SUPABASE_PUBLIC_KEY__ === 'string') ? window.__SUPABASE_PUBLIC_KEY__ : '';\n",s,count=1,flags=re.M)
              if n!=1: raise SystemExit(file+': SUPABASE_KEY declaration not found')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Install config seams
        run: |
          cat > my_AI/security_config.js <<'EOF'
          /* Public configuration only. Never store service credentials here. */
          window.__SUPABASE_PUBLIC_KEY__ = window.__SUPABASE_PUBLIC_KEY__ || '';
          EOF
          cat > Mastermind_Desktop/security_config.js <<'EOF'
          /* Public configuration only. Never store service credentials here. */
          window.__SUPABASE_PUBLIC_KEY__ = window.__SUPABASE_PUBLIC_KEY__ || '';
          EOF
      - name: Static verification
        run: |
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
          python3 - <<'PY'
          from pathlib import Path
          for f in ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']:
              s=Path(f).read_text(encoding='utf-8')
              assert 'function runUniversalAgentOperatingLoop(options={})' in s
              assert "else if(name==='fast_file_search')" in s
              assert 'function normalizePathForCloud(path)' in s
              assert "service_role" not in s
              assert "SUPABASE_KEY = 'eyJ" not in s
          print('Static verification passed')
          PY
      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/harden_agent_core.yml
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js my_AI/security_config.js Mastermind_Desktop/security_config.js .github/workflows/harden_agent_core.yml
          git commit -m 'Harden agent loop and remove embedded service credential'
          git push
