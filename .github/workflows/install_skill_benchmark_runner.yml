name: Integrate Universal Skill Benchmark Runner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message != 'Integrate Universal Skill Benchmark Runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute runner integration and behavioral gate
        run: node .github/skill_benchmark_runner_integrate.js
