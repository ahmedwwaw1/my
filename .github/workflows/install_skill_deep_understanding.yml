name: Integrate Universal Skill Deep Understanding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate deep understanding engine
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const targets=[
            {core:'my_AI/ai_engine_core.js',engine:'my_AI/universal_skill_deep_understanding_engine.js'},
            {core:'Mastermind_Desktop/core.js',engine:'Mastermind_Desktop/universal_skill_deep_understanding_engine.js'}
          ];
          const decl=`\nconst UNIVERSAL_SKILL_DEEP_UNDERSTANDING_TOOL_DECLARATION={name:'skill_deep_understanding',description:'Analyze external/local Skill sources semantically: concepts, relations, procedures, conflicts, evidence and deep Skill draft. Never execute imported source code.',parameters:{type:'OBJECT',properties:{action:{type:'STRING',enum:['understand','analyze','synthesize','build','validate','from_synthesis','import_github_sources','import_local_sources']},name:{type:'STRING'},id:{type:'STRING'},domain:{type:'STRING'},topic:{type:'STRING'},description:{type:'STRING'},repository:{type:'STRING'},path:{type:'STRING'},ref:{type:'STRING'},sources:{type:'ARRAY',items:{type:'OBJECT'}},units:{type:'ARRAY',items:{type:'OBJECT'}},synthesis:{type:'OBJECT'},result:{type:'OBJECT'},options:{type:'OBJECT'}},required:['action']}};\n`;
          for(const t of targets){
            let core=fs.readFileSync(t.core,'utf8');
            const engine=fs.readFileSync(t.engine,'utf8');
            if(!core.includes('UNIVERSAL_SKILL_DEEP_UNDERSTANDING_VERSION')) core += '\n\n/* --- Integrated Universal Skill Deep Understanding Engine --- */\n'+engine+'\n';
            if(!core.includes('UNIVERSAL_SKILL_DEEP_UNDERSTANDING_TOOL_DECLARATION')) core += decl;
            core=core.replace(/CORE:\s*\["skill_synthesis",\s*/g,'CORE: ["skill_deep_understanding", "skill_synthesis", ');
            if(!core.includes('name === "skill_deep_understanding"')){
              const li=core.indexOf('async function runToolLoop');
              const marker='else if (name === "skill_synthesis")';
              const insert=li>=0?core.indexOf(marker,li):-1;
              if(insert>=0){
                const branch=`else if (name === "skill_deep_understanding") toolResult = await universalSkillDeepUnderstandingManager(args?.action || "synthesize", args || {}, {\n  fetchSources: async ({repository,path,ref,options={}}) => {\n    const maxFiles=Number(options.maxFiles||20), maxChars=Number(options.maxCharsPerFile||60000);\n    async function walk(p){const endpoint=\`https://api.github.com/repos/\${repository}/contents/\${p||''}?ref=\${encodeURIComponent(ref||'main')}\`;const data=await callBridge('github',{endpoint,method:'GET'});if(data?.type==='file'&&data.content){const raw=atob(String(data.content).replace(/\\s/g,''));let text=raw;try{text=decodeURIComponent(escape(raw));}catch(_){}return[{path:p,text:String(text).slice(0,maxChars)}]}if(!Array.isArray(data))return[];const out=[];for(const e of data){if(out.length>=maxFiles)break;if(e.type==='file'&&/\\.(md|markdown|txt|json|ya?ml|js|mjs|cjs|ts|tsx|py|java|kt|go|rs|rb|php|cs|cpp|h)$/i.test(e.name)){out.push(...(await walk(e.path)).slice(0,maxFiles-out.length))}else if(e.type==='dir')out.push(...(await walk(e.path)).slice(0,maxFiles-out.length))}return out}return walk(String(path||''));\n  },\n  readSources: async ({path,options={}}) => {if(typeof getGithubFileContent==='function'){const text=await getGithubFileContent(path);return text?[{path,text:String(text).slice(0,Number(options.maxCharsPerFile||60000))}]:[]}if(typeof callLocalBridge==='function'){const r=await callLocalBridge('read',{path});return r?[{path,text:typeof r==='string'?r:JSON.stringify(r)}]:[]}return[]}\n});\n                `;
                core=core.slice(0,insert)+branch+core.slice(insert);
              }
            }
            const constitutionNeedle='  "universal_skill_synthesis": "For external or local expert sources, extract source evidence, synthesize a declarative draft Skill, validate provenance/schema/safety, and keep it as draft until explicitly activated. Never execute imported source code as part of synthesis.",';
            if(core.includes(constitutionNeedle)&&!core.includes('universal_skill_deep_understanding')) core=core.replace(constitutionNeedle,constitutionNeedle+'\n  "universal_skill_deep_understanding": "Before activating a synthesized Skill, build a semantic model of concepts, relations, procedures, conflicts and evidence. Conflicting source rules must be surfaced, not silently resolved. Deep understanding outputs remain draft until validation passes and activation is explicit.",');
            const boot='\n(function(){if(typeof AI_TOOLS!==\'undefined\'&&AI_TOOLS[0]?.function_declarations&&!AI_TOOLS[0].function_declarations.some(x=>x.name===\'skill_deep_understanding\'))AI_TOOLS[0].function_declarations.push(UNIVERSAL_SKILL_DEEP_UNDERSTANDING_TOOL_DECLARATION);})();\n';
            if(!core.includes('UNIVERSAL_SKILL_DEEP_UNDERSTANDING_TOOL_DECLARATION);})();')) core+=boot;
            fs.writeFileSync(t.core,core);
          }
          NODE
      - name: Syntax gate
        run: |
          set -euo pipefail
          node --check my_AI/universal_skill_deep_understanding_engine.js
          node --check Mastermind_Desktop/universal_skill_deep_understanding_engine.js
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/install_skill_deep_understanding.yml
          git add my_AI/universal_skill_deep_understanding_engine.js Mastermind_Desktop/universal_skill_deep_understanding_engine.js my_AI/ai_engine_core.js Mastermind_Desktop/core.js
          git commit -m 'Add Universal Skill Deep Understanding Engine'
          git push origin HEAD:main
