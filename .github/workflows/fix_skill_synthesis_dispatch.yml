name: Fix Skill Synthesis Dispatch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire synthesis into router and dispatcher
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          for(const path of ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']){
            let core=fs.readFileSync(path,'utf8');
            core=core.replace(/CORE:\s*\["skill_manager",\s*/g,'CORE: ["skill_manager", "skill_synthesis", ');
            core=core.replace(/CORE:\s*\[/g,(m)=>m);
            const marker='else if (name === "skill_manager") toolResult = await universalSkillManager';
            const idx=core.indexOf(marker);
            if(idx>=0 && !core.includes('name === "skill_synthesis"')){
              const endMarker='}); toolResult = `✅ العملية [${name}] اكتملت.`;';
              const end=core.indexOf(endMarker,idx);
              if(end>=0){
                const branch=`});\n                else if (name === "skill_synthesis") toolResult = await universalSkillSynthesisManager(args?.action || "synthesize", args || {}, {\n                    fetchSources: async ({repository,path,ref,options={}}) => {\n                        const maxFiles=Number(options.maxFiles||20), maxChars=Number(options.maxCharsPerFile||60000);\n                        async function walk(p){\n                            const endpoint=\`https://api.github.com/repos/\${repository}/contents/\${p||''}?ref=\${encodeURIComponent(ref||'main')}\`;\n                            const data=await callBridge('github',{endpoint,method:'GET'});\n                            if(data?.type==='file'&&data.content){const raw=atob(String(data.content).replace(/\\s/g,''));let text=raw;try{text=decodeURIComponent(escape(raw));}catch(_){}return [{path:p,text:String(text).slice(0,maxChars)}];}\n                            if(!Array.isArray(data))return []; const out=[];\n                            for(const e of data){if(out.length>=maxFiles)break;if(e.type==='file'&&/\\.(md|markdown|txt|json|ya?ml|js|mjs|cjs|ts|tsx|py|java|kt|go|rs|rb|php|cs|cpp|h)$/i.test(e.name)){const xs=await walk(e.path);out.push(...xs.slice(0,maxFiles-out.length));}else if(e.type==='dir'){const xs=await walk(e.path);out.push(...xs.slice(0,maxFiles-out.length));}}\n                            return out;\n                        }\n                        return walk(String(path||''));\n                    },\n                    readSources: async ({path,options={}}) => {\n                        if(typeof getGithubFileContent==='function'){const text=await getGithubFileContent(path);return text?[{path,text:String(text).slice(0,Number(options.maxCharsPerFile||60000))}]:[];}\n                        if(typeof callLocalBridge==='function'){const r=await callLocalBridge('read',{path});return r?[{path,text:typeof r==='string'?r:JSON.stringify(r)}]:[];}\n                        return [];\n                    }\n                });`;
                core=core.slice(0,end)+branch+core.slice(end+endMarker.length);
                core += '\n';
              }
            }
            // Ensure synthesis tool is part of the default CORE routing set.
            core=core.replace('CORE: ["architecture_loop"','CORE: ["skill_synthesis", "architecture_loop"');
            fs.writeFileSync(path,core);
          }
          NODE
      - name: Syntax gate
        run: |
          set -euo pipefail
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
          node --check my_AI/universal_skill_synthesis_engine.js
          node --check Mastermind_Desktop/universal_skill_synthesis_engine.js
      - name: Commit and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix_skill_synthesis_dispatch.yml
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js
          git commit -m 'Wire Universal Skill Synthesis into agent dispatch'
          git push origin HEAD:main
