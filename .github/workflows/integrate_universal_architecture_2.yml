name: Integrate Universal Architecture 2.0

on:
  push:
    branches: [ main ]

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Expansion into both cores
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const paths = ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js'];
          const expansion = fs.readFileSync('my_AI/universal_architecture_expansion.js','utf8')
            .replace(/\n?if\(typeof module[^\n]*\n?$/,'').trim();
          for (const file of paths) {
            let code = fs.readFileSync(file,'utf8');
            if (!code.includes('UNIVERSAL_ARCHITECTURE_EXPANSION_VERSION')) {
              const anchor = '// --- [AI Engine Logic] ---';
              if (!code.includes(anchor)) throw new Error(`Expansion anchor not found in ${file}`);
              code = code.replace(anchor, `${expansion}\n\n${anchor}`);
            }
            if (!code.includes('const architectureExpansion = runUniversalArchitectureExpansion(')) {
              const repairLine = 'const repair = architectRepairPlan(validation, design);';
              if (!code.includes(repairLine)) throw new Error(`Architect loop anchor not found in ${file}`);
              code = code.replace(repairLine, `${repairLine}\n    const architectureExpansion = runUniversalArchitectureExpansion(scanResult, { environment: options.environment || 'Unknown', baseline: options.baseline || null, runtimeEvidence: options.runtimeEvidence || null });`);
              const stageAnchor = '        stages: [';
              if (!code.includes(stageAnchor)) throw new Error(`Stage anchor not found in ${file}`);
              code = code.replace(stageAnchor, '        architectureExpansion,\n        stages: [');
            }
            fs.writeFileSync(file, code);
          }
          NODE
      - name: Validate JavaScript
        run: |
          node --check my_AI/universal_architecture_expansion.js
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
      - name: Commit integrated cores and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js
          git rm .github/workflows/integrate_universal_architecture_2.yml
          git commit -m "Integrate Universal Architecture 2.0 into architect loop"
          git push
