name: Bind Evidence Engine

on:
  push:
    paths:
      - '.github/workflows/bind_evidence_loop.yml'
      - 'scripts/bind_evidence_loop.js'

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply evidence binding
        run: |
          node scripts/bind_evidence_loop.js
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
          node --check my_AI/universal_evidence_engine.js
          node --check Mastermind_Desktop/universal_evidence_engine.js
      - name: Verify binding
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']) {
            const s = fs.readFileSync(file,'utf8');
            if ((s.match(/async function runUniversalAgentOperatingLoop\(/g) || []).length !== 0) throw new Error('wrapper declaration remains: ' + file);
            if ((s.match(/async function runUniversalAgentOperatingLoopLegacy\(/g) || []).length !== 1) throw new Error('legacy declaration invalid: ' + file);
            if (!s.includes('UNIVERSAL_EVIDENCE_ADAPTER_VERSION')) throw new Error('adapter missing: ' + file);
            if (!s.includes('finalizeUniversalEvidenceMission')) throw new Error('evidence engine missing: ' + file);
          }
          for (const file of ['my_AI/universal_evidence_engine.js','Mastermind_Desktop/universal_evidence_engine.js']) {
            const s = fs.readFileSync(file,'utf8');
            if (s.includes("verificationStatus === 'unknown'")) throw new Error('unknown verification accepted: ' + file);
          }
          console.log('Evidence binding verification passed.');
          NODE
      - name: Commit and cleanup
        run: |
          rm -f scripts/bind_evidence_loop.js .github/workflows/bind_evidence_loop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js my_AI/universal_evidence_engine.js Mastermind_Desktop/universal_evidence_engine.js scripts/bind_evidence_loop.js .github/workflows/bind_evidence_loop.yml
          git commit -m 'Bind evidence engine into operating loop'
          git push
