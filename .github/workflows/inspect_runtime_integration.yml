name: Inspect runtime integration points
on:
  push:
    paths:
      - '.github/workflows/inspect_runtime_integration.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect core dispatch
        shell: bash
        run: |
          echo '--- DESKTOP ---'
          grep -n -E 'run_terminal_command|architecture_loop|function .*Tool|toolResult|functionCall|functionResponse' Mastermind_Desktop/core.js | tail -n 120 || true
          echo '--- CLOUD ---'
          grep -n -E 'run_terminal_command|architecture_loop|function .*Tool|toolResult|functionCall|functionResponse' my_AI/ai_engine_core.js | tail -n 120 || true
