name: Auto Update Crypto Alerts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود الحالي من المستودع
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. تنصيب بيئة بايثون
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. تثبيت المكتبات المطلوبة
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ccxt

    # 4. تشغيل السكربت لتحديث ملف الـ JSON
    - name: Run crypto bot script
      run: python crypto_bot.py

    # 5. حفظ وتمرير التعديلات الجديدة تلقائياً
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add crypto_alerts.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 تحديث تلقائي لبيانات التداول" && git push)