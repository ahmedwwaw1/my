name: Auto Update Crypto Alerts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # 🔐 إضافة الصلاحيات الصريحة للسماح للسيرفر بالكتابة والحفظ داخل الـ Repository
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ccxt

    - name: Run crypto bot script
      run: python crypto_bot.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add crypto_alerts.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 تحديث تلقائي لبيانات التداول" && git push)