name: Agent Core Hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch and verify core engines
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js'];
          const report = [];
          for (const file of files) {
            let s = fs.readFileSync(file,'utf8');
            const marker = 'async function runClosedRuntimeRepairLoop(options={})';
            const beforeCount = s.split(marker).length - 1;
            const first = s.indexOf(marker);
            const second = first >= 0 ? s.indexOf(marker, first + marker.length) : -1;
            if (first >= 0 && second >= 0) s = s.slice(0, first) + s.slice(second);

            s = s.replace(/(\b(?:const|let|var)\s+initialScan\s*=\s*)(?!await\s+)(?:performCloudArchitectureDiscovery|performArchitectureDiscovery)\(runtimeRoot\)\s*;/g, '$1await $&'.replace('$&','')); 
            s = s.replace('const initialScan = performCloudArchitectureDiscovery(runtimeRoot);','const initialScan = await performCloudArchitectureDiscovery(runtimeRoot);');
            s = s.replace('const initialScan = performArchitectureDiscovery(runtimeRoot);','const initialScan = await performArchitectureDiscovery(runtimeRoot);');
            s = s.replace(/expectedStatus:2(?!\d)/g, 'expectedStatus:200');
            s = s.replace('security:op.security??doc.security??null});', 'security:op.security??doc.security??null,openApiDocument:doc});');
            s = s.replace('responseSchema:apiResolveSchema(c.responseSchema||c.responses?.[String(response.status)]?.content?.[\'application/json\']?.schema||null,c)', 'responseSchema:apiResolveSchema(c.openApiDocument||{},c.responseSchema||c.responses?.[String(response.status)]?.content?.[\'application/json\']?.schema||null)');
            fs.writeFileSync(file,s);

            const remaining = s.split(marker).length - 1;
            const okAwait = /\binitialScan\s*=\s*await\s+(?:performCloudArchitectureDiscovery|performArchitectureDiscovery)\(runtimeRoot\)\s*;/.test(s);
            const okStatus = !/expectedStatus:2(?!\d)/.test(s);
            const okSchema = !s.includes("responseSchema:apiResolveSchema(c.responseSchema||c.responses?.[String(response.status)]?.content?.['application/json']?.schema||null,c)");
            if (remaining !== 1 || !okAwait || !okStatus || !okSchema) throw new Error(`${file}: static verification failed before=${beforeCount} after=${remaining} await=${okAwait} status=${okStatus} schema=${okSchema}`);
            report.push({file,beforeClosedRepairDefinitions:beforeCount,afterClosedRepairDefinitions:remaining,awaitFixed:okAwait,routeStatusFixed:okStatus,schemaResolverFixed:okSchema});
          }
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check my_AI/ai_engine_core.js
          node --check my_AI/universal_api_testing_engine.js
          node --check Mastermind_Desktop/core.js
          node --check Mastermind_Desktop/universal_api_testing_engine.js
      - name: Remove temporary workflow and commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/agent_core_hotfix.yml
          git add my_AI/ai_engine_core.js my_AI/universal_api_testing_engine.js Mastermind_Desktop/core.js Mastermind_Desktop/universal_api_testing_engine.js .github/workflows/agent_core_hotfix.yml
          git commit -m 'Complete agent architecture runtime hotfix'
          git push