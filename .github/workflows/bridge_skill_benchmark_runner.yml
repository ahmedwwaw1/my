name: Connect Skill Benchmark Evolution to Runner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bridge:
    if: github.event.head_commit.message != 'Connect Skill Benchmark Evolution to Runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify bridge
        run: node .github/bridge_skill_benchmark_runner.js
