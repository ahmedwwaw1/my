name: Integrate Universal API Testing
on:
  push:
    paths:
      - '.github/workflows/upgrade_api_testing.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch both runtime engines
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['my_AI/universal_runtime_verification_engine.js','Mastermind_Desktop/universal_runtime_verification_engine.js'];
          for(const file of files){
            let s=fs.readFileSync(file,'utf8');
            if(!s.includes("runUniversalApiContractTesting")){
              s=s.replace(/(const UNIVERSAL_RUNTIME_VERIFICATION_VERSION='[^']+';)/,"$1\nlet runUniversalApiContractTesting=null;\ntry{({runUniversalApiContractTesting}=require('./universal_api_testing_engine'));}catch(e){}\n");
            }
            if(!s.includes('apiContractTests=null')){
              s=s.replace('let pid=null,runtimeStarted=false,ports=[],health=[],runtimeLog=null;','let pid=null,runtimeStarted=false,ports=[],health=[],runtimeLog=null,apiContractTests=null;');
            }
            if(!s.includes("phase:'api-contract-suite'")){
              const marker="runtimeLog=await urvExec(options,'runtime-log'";
              const injection="if(runUniversalApiContractTesting&&options.apiTesting!==false&&runtimeStarted){try{const base=options.apiBaseUrl||(options.healthUrl?String(options.healthUrl).replace(/(https?:\\/\\/[^/]+).*/,'$1'):(ports[0]?`http://127.0.0.1:${ports[0]}`:''));apiContractTests=await runUniversalApiContractTesting({execute:options.execute,environment:env,root,baseUrl:base,timeoutMs:options.apiTimeoutMs||20000,maxEndpoints:options.apiMaxEndpoints||30,maxNegativeTests:options.apiMaxNegativeTests||2,allowMutations:options.apiAllowMutations===true,negativeTests:options.apiNegativeTests!==false});}catch(e){apiContractTests={available:false,status:'failed',summary:{total:0,passed:0,failed:1,negative:0},error:urvRedact(e?.message||String(e))};}}\n";
              if(!s.includes(marker)) throw new Error('runtime-log marker not found in '+file);
              s=s.replace(marker,injection+marker);
            }
            if(!s.includes('apiContractTests?.status===\'failed\'')){
              s=s.replace('const failed=[...phases.map(p=>p.evidence).filter(e=>!e.ok),...health.filter(e=>!e.ok)],firstFailure=failed[0]||null;',"const apiFailure=apiContractTests?.status==='failed';const failed=[...phases.map(p=>p.evidence).filter(e=>!e.ok),...health.filter(e=>!e.ok),...(apiFailure?[{phase:'api-contract-suite',ok:false,output:JSON.stringify(apiContractTests).slice(-12000),signals:{}}]:[])],firstFailure=failed[0]||null;");
            }
            if(!s.includes('apiContractTests,postSnapshot')){
              s=s.replace('healthChecks:health,runtimeLog,postSnapshot,postSnapshotError,architectureDiff,repair:', 'healthChecks:health,apiContractTests,runtimeLog,postSnapshot,postSnapshotError,architectureDiff,repair:');
            }
            s=s.replace('apiChecks:health.length,retriesUsed:', 'apiChecks:health.length+(apiContractTests?.summary?.total||0),retriesUsed:');
            fs.writeFileSync(file,s);
          }
          for(const f of files) require('child_process').execFileSync(process.execPath,['--check',f],{stdio:'inherit'});
          NODE
      - name: Verify API engine
        run: node --check my_AI/universal_api_testing_engine.js
      - name: Remove temporary workflow
        run: rm -f .github/workflows/upgrade_api_testing.yml
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add my_AI/universal_api_testing_engine.js my_AI/universal_runtime_verification_engine.js Mastermind_Desktop/universal_runtime_verification_engine.js .github/workflows/upgrade_api_testing.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m 'Upgrade runtime verification to full API contract testing'
          git push