name: Repair three architecture integration gaps
on:
  push:
    paths:
      - '.github/workflows/fix_three_architecture_points.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch both cores and Desktop API engine
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const apiPath = 'my_AI/universal_api_testing_engine.js';
          const apiSource = fs.readFileSync(apiPath, 'utf8').replace(/\nif\(typeof module[^]*$/,'').trim();
          const runtimeSource = fs.readFileSync('my_AI/universal_runtime_verification_engine.js', 'utf8');
          const rs = runtimeSource.indexOf('async function runUniversalRuntimeVerification');
          const re = runtimeSource.indexOf("if(typeof module!=='undefined')module.exports=", rs);
          if (rs < 0 || re < 0) throw new Error('Runtime engine anchors missing');
          const runtimeBlock = runtimeSource.slice(rs, re).trim();
          const loopStart = runtimeSource.indexOf('async function runClosedRuntimeRepairLoop');
          if (loopStart < 0) throw new Error('Closed repair loop missing');
          const loopBlock = runtimeSource.slice(loopStart, re).trim();
          const fullRuntime = `${runtimeBlock}\n\n${loopBlock}`;

          fs.writeFileSync('Mastermind_Desktop/universal_api_testing_engine.js', apiSource + '\n');

          for (const file of ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']) {
            let s = fs.readFileSync(file, 'utf8');

            if (!s.includes('const UNIVERSAL_API_TESTING_VERSION')) {
              const anchor = 'const AI_TOOLS = [{';
              if (!s.includes(anchor)) throw new Error(`API insertion anchor missing: ${file}`);
              s = s.replace(anchor, `${apiSource}\n\n${anchor}`);
            }

            const repairSig = 'function architectRepairPlan(validation, design) {';
            if (s.includes(repairSig)) {
              s = s.replace(repairSig, 'function architectRepairPlan(validation, design, architectureExpansion = null) {');
            }
            const badRepair = "        architectureExpansion,\n        stages:";
            if (!s.includes(badRepair)) throw new Error(`Architecture expansion repair-stage anchor missing: ${file}`);
            s = s.replace(badRepair, "        architectureExpansion,\n        stages:");

            const oldOrder = "    const validation = architectValidationPlan(design, snapshot);\n    const repair = architectRepairPlan(validation, design);\n    const architectureExpansion = runUniversalArchitectureExpansion";
            const newOrder = "    const validation = architectValidationPlan(design, snapshot);\n    const architectureExpansion = runUniversalArchitectureExpansion";
            if (s.includes(oldOrder)) {
              s = s.replace(oldOrder, newOrder);
              const marker = "    const architectureExpansion = runUniversalArchitectureExpansion";
              const pos = s.indexOf(marker);
              const lineEnd = s.indexOf('\n', pos);
              const expansionLine = s.slice(pos, lineEnd < 0 ? s.length : lineEnd);
              const tailMarker = "    return {\n        loopVersion:";
              const returnPos = s.indexOf(tailMarker, pos);
              if (returnPos < 0) throw new Error(`Architect return anchor missing: ${file}`);
              const insertAt = returnPos;
              s = s.slice(0, insertAt) + "    const repair = architectRepairPlan(validation, design, architectureExpansion);\n" + s.slice(insertAt);
            } else if (!s.includes('const repair = architectRepairPlan(validation, design, architectureExpansion);')) {
              throw new Error(`Architect ordering anchor missing: ${file}`);
            }

            const runStart = s.indexOf('async function runUniversalRuntimeVerification');
            const toolLoop = s.indexOf('async function runToolLoop(history)', runStart);
            if (runStart < 0 || toolLoop < 0) throw new Error(`Runtime/tool-loop anchors missing: ${file}`);
            s = s.slice(0, runStart) + fullRuntime + '\n\n' + s.slice(toolLoop);

            fs.writeFileSync(file, s);
            cp.execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          }

          cp.execFileSync(process.execPath, ['--check', apiPath], { stdio: 'inherit' });
          cp.execFileSync(process.execPath, ['--check', 'Mastermind_Desktop/universal_api_testing_engine.js'], { stdio: 'inherit' });

          const verify = [
            ['my_AI/ai_engine_core.js', ['runClosedRuntimeRepairLoop','runUniversalApiContractTesting','architectureExpansion']],
            ['Mastermind_Desktop/core.js', ['runClosedRuntimeRepairLoop','runUniversalApiContractTesting','architectureExpansion']],
            ['my_AI/universal_api_testing_engine.js', ['runUniversalApiContractTesting']],
            ['Mastermind_Desktop/universal_api_testing_engine.js', ['runUniversalApiContractTesting']]
          ];
          for (const [file, needles] of verify) {
            const text = fs.readFileSync(file,'utf8');
            for (const needle of needles) if (!text.includes(needle)) throw new Error(`Verification marker ${needle} missing in ${file}`);
          }
          NODE
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix_three_architecture_points.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js my_AI/universal_api_testing_engine.js Mastermind_Desktop/universal_api_testing_engine.js .github/workflows/fix_three_architecture_points.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Repair three core architecture integration gaps'
          git push
