name: Agent Operating Loop Upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upgrade cores
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const files=['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js'];
          const helper=`
/** Universal Agent Operating Loop 1.0 */
const UNIVERSAL_AGENT_OPERATING_LOOP_VERSION='1.0-operating-loop';
async function runUniversalAgentOperatingLoop(options={}){
    const root=options.root||'.';
    const environment=options.environment||'Unknown';
    const objective=options.objective||'';
    const constraints=options.constraints||{};
    const discover=typeof performCloudArchitectureDiscovery==='function'
        ? ()=>performCloudArchitectureDiscovery(root)
        : (typeof performArchitectureDiscovery==='function' ? ()=>performArchitectureDiscovery(root) : null);
    if(!discover)return{available:false,status:'discovery-unavailable',version:UNIVERSAL_AGENT_OPERATING_LOOP_VERSION};
    const initialScan=await discover();
    const plan=runUniversalArchitectLoop(initialScan,{environment,objective,constraints});
    const allowed=new Set(['read_file','write_file','replace_file_content','multi_replace_file_content','analyze_file','list_files','fast_file_search']);
    const history=[{role:'user',parts:[{text:`You are the implementation executor inside a closed engineering loop. Objective: ${objective}\nArchitecture plan:\n${JSON.stringify(plan).slice(-24000)}\nRules: implement only the requested objective; preserve existing contracts; inspect before writing; make the smallest safe cross-file changes; do not call architecture_loop or runtime_verify; do not redesign unrelated code; stop after the objective is implemented.`}]}];
    const executions=[]; let changed=false;
    for(let turn=0;turn<5;turn++){
        const response=await callAiBrain(history);
        const candidate=response?.candidates?.[0];
        if(!candidate?.content?.parts?.length)break;
        history.push(candidate.content);
        const calls=candidate.content.parts.filter(p=>p.functionCall&&allowed.has(p.functionCall.name));
        if(!calls.length)break;
        for(const part of calls.slice(0,8)){
            const {name,args={}}=part.functionCall;
            const path=normalizePathForCloud(args.path||'');
            let result;
            if(name==='read_file'||name==='analyze_file'){
                if(typeof getGithubFileContent==='function')result=await getGithubFileContent(path);
                else result=await callLocalBridge('read',{path});
            }else if(name==='list_files'){
                if(typeof listGithubFiles==='function')result=await listGithubFiles(path||'');
                else result=await callLocalBridge('list',{path:path||'.'});
            }else if(name==='write_file'){
                if(typeof writeFile==='function')result=await writeFile(path,args.content||'', 'Universal Agent Operating Loop implementation');
                else result=await callLocalBridge('write',{path,content:args.content||''});
                changed=true;
            }else if(name==='replace_file_content'){
                if(typeof replaceFileContent==='function')result=await replaceFileContent(path,args.targetContent||'',args.replacementContent||'');
                else result=await callLocalBridge('write',{path,content:args.replacementContent||''});
                changed=true;
            }else if(name==='multi_replace_file_content'){
                let current=typeof getGithubFileContent==='function'?await getGithubFileContent(path):await callLocalBridge('read',{path});
                if(current&&typeof current==='object'&&current.content)current=current.content;
                let updated=String(current||'');
                for(const r of (args.replacements||[]))if(updated.includes(r.targetContent))updated=updated.replace(r.targetContent,r.replacementContent);
                if(typeof writeFile==='function')result=await writeFile(path,updated,'Universal Agent Operating Loop multi-file implementation');
                else result=await callLocalBridge('write',{path,content:updated});
                changed=true;
            }
            executions.push({turn,name,path,result:typeof result==='string'?result:JSON.stringify(result)});
            history.push({role:'function',parts:[{functionResponse:{name,response:{content:typeof result==='string'?result:JSON.stringify(result)}}}]});
        }
    }
    let verification=null;
    if(changed&&options.verify!==false&&typeof runClosedRuntimeRepairLoop==='function'){
        const execute=async command=>typeof callLocalBridge==='function'?callLocalBridge('cmd',{command}):null;
        verification=await runClosedRuntimeRepairLoop({
            environment,root,snapshot:initialScan,baseline:initialScan,
            runBuild:options.runBuild!==false,runTests:options.runTests!==false,runRuntime:options.runRuntime!==false,
            startCommand:options.startCommand||'',healthUrl:options.healthUrl||'',apiPath:options.apiPath||'',
            maxRetries:options.maxRetries??1,runtimeChecks:options.runtimeChecks??3,maxRepairAttempts:options.maxRepairAttempts??2,
            execute,
            discover,
            repair:async({failure})=>{
                const repairHistory=[{role:'user',parts:[{text:`Repair only the first evidenced root cause. Objective remains: ${objective}. Evidence:\n${JSON.stringify(failure).slice(-16000)}\nInspect the implicated file(s), apply the smallest safe fix, and do not redesign unrelated code.`}]}];
                let applied=false; const results=[];
                for(let t=0;t<3;t++){
                    const r=await callAiBrain(repairHistory); const c=r?.candidates?.[0]; if(!c?.content?.parts?.length)break; repairHistory.push(c.content);
                    const calls=c.content.parts.filter(p=>p.functionCall&&['read_file','write_file','replace_file_content','multi_replace_file_content','analyze_file'].includes(p.functionCall.name));
                    if(!calls.length)break;
                    for(const part of calls.slice(0,6)){
                        const {name,args={}}=part.functionCall; const path=normalizePathForCloud(args.path||''); let out;
                        if(name==='read_file'||name==='analyze_file')out=typeof getGithubFileContent==='function'?await getGithubFileContent(path):await callLocalBridge('read',{path});
                        else if(name==='write_file'){out=typeof writeFile==='function'?await writeFile(path,args.content||'','Closed runtime repair'):await callLocalBridge('write',{path,content:args.content||''});applied=true;}
                        else if(name==='replace_file_content'){out=typeof replaceFileContent==='function'?await replaceFileContent(path,args.targetContent||'',args.replacementContent||''):await callLocalBridge('write',{path,content:args.replacementContent||''});applied=true;}
                        else {let cur=typeof getGithubFileContent==='function'?await getGithubFileContent(path):await callLocalBridge('read',{path});if(cur&&typeof cur==='object'&&cur.content)cur=cur.content;let upd=String(cur||'');for(const x of (args.replacements||[]))if(upd.includes(x.targetContent))upd=upd.replace(x.targetContent,x.replacementContent);out=typeof writeFile==='function'?await writeFile(path,upd,'Closed runtime repair batch'):await callLocalBridge('write',{path,content:upd});applied=true;}
                        results.push({name,path,result:typeof out==='string'?out:JSON.stringify(out)});
                    }
                    if(applied)break;
                }
                return{applied,results};
            }
        });
    }
    const finalScan=await discover();
    const baselineArch={components:initialScan?.architecture?.components||initialScan?.components||[]};
    const finalArch={components:finalScan?.architecture?.components||finalScan?.components||[]};
    const diff=typeof ua2ArchitectureDiff==='function'?ua2ArchitectureDiff(baselineArch,finalArch):null;
    return{available:true,version:UNIVERSAL_AGENT_OPERATING_LOOP_VERSION,status:verification?.status||'implemented',objective,plan,implementation:{changed,executions},verification,architectureDiff:diff,finalDiscoverySummary:finalScan?.summary||null,closedLoop:Boolean(changed&&verification)};
}
`;
          for(const file of files){
            let s=fs.readFileSync(file,'utf8');
            if(!s.includes("UNIVERSAL_AGENT_OPERATING_LOOP_VERSION")){
              const anchor=s.includes('async function callAiBrain(history)')?'async function callAiBrain(history)':(s.includes('async function callAiBrain')?'async function callAiBrain':null);
              if(!anchor)throw new Error(`${file}: callAiBrain anchor not found`);
              s=s.replace(anchor,helper+'\n'+anchor);
            }
            const re=/else if \(name === [\"']architecture_loop[\"']\) \{[\s\S]*?\n\s*\}\s*else if \(name === [\"']runtime_verify[\"']\)/;
            const replacement=`else if (name === "architecture_loop") {\n                try {\n                    toolResult = await runUniversalAgentOperatingLoop({\n                        environment: "${file.includes('Mastermind_Desktop')?'Windows Desktop':'GitHub Cloud'}",\n                        root: safePath || "",\n                        objective: args?.objective || "",\n                        constraints: args?.constraints || {},\n                        verify: true,\n                        maxRepairAttempts: 2\n                    });\n                } catch (architectureError) {\n                    toolResult = { error: "Universal agent operating loop failed.", details: architectureError?.message || String(architectureError) };\n                }\n            }\n            else if (name === "runtime_verify")`;
            if(!re.test(s))throw new Error(`${file}: architecture_loop branch not found`);
            s=s.replace(re,replacement);
            fs.writeFileSync(file,s);
          }
          NODE
      - name: Syntax and static verification
        shell: bash
        run: |
          set -euo pipefail
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
          node --check my_AI/universal_api_testing_engine.js
          node --check Mastermind_Desktop/universal_api_testing_engine.js
          node <<'NODE'
          const fs=require('fs');
          for(const f of ['my_AI/ai_engine_core.js','Mastermind_Desktop/core.js']){
            const s=fs.readFileSync(f,'utf8');
            if((s.match(/UNIVERSAL_AGENT_OPERATING_LOOP_VERSION/g)||[]).length!==1)throw new Error(`${f}: loop version marker count invalid`);
            if(!s.includes('runUniversalAgentOperatingLoop'))throw new Error(`${f}: operating loop missing`);
            if(!/toolResult = await runUniversalAgentOperatingLoop\(/.test(s))throw new Error(`${f}: architecture tool not wired to operating loop`);
          }
          console.log('Universal Agent Operating Loop static verification passed.');
          NODE
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/agent_operating_loop_upgrade.yml
          git add my_AI/ai_engine_core.js Mastermind_Desktop/core.js .github/workflows/agent_operating_loop_upgrade.yml
          git commit -m 'Upgrade architecture loop to closed agent operating loop'
          git push
