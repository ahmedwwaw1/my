name: Upgrade Universal Architect Loop

on:
  push:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, 'Upgrade Universal Architect Loop') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject architect loop into both cores
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const engine = fs.readFileSync('my_AI/universal_architect_engine.js', 'utf8').trim();
          const declaration = `{ name: "architecture_loop", description: "وكيل معماري شامل يحول Discovery إلى دورة هندسية كاملة: فهم المعمارية، تحليل القيود، التخطيط، التصميم، التنفيذ متعدد الملفات، التحقق، والإصلاح.", parameters: { type: "OBJECT", properties: { path: { type: "STRING", description: "مسار المشروع أو المجلد المراد تحليله." }, objective: { type: "STRING", description: "الهدف المعماري المطلوب." }, constraints: { type: "OBJECT", description: "قيود اختيارية مثل الحفاظ على API والبيانات وتقليل الاعتماديات." } } } }`;

          const targets = [
            {
              path: 'my_AI/ai_engine_core.js',
              environment: 'GitHub Cloud',
              discoveryBranch: `else if (name === "discovery_scan") {\n        try {\n            toolResult = await performCloudArchitectureDiscovery(safePath || "");\n        } catch (scanError) {\n            toolResult = {\n                error: "Cloud discovery scan failed.",\n                details: scanError?.message || String(scanError),\n                fallback: await listGithubFiles(safePath || "")\n            };\n        }\n    }`,
              architectureCall: `await performCloudArchitectureDiscovery(safePath || "")`
            },
            {
              path: 'Mastermind_Desktop/core.js',
              environment: 'Windows Desktop',
              discoveryBranch: `else if (name === "discovery_scan") {\n                toolResult = performArchitectureDiscovery(args?.path || ".");\n            }`,
              architectureCall: `performArchitectureDiscovery(args?.path || ".")`
            }
          ];

          for (const target of targets) {
            let patched = fs.readFileSync(target.path, 'utf8');
            if (patched.includes('const UNIVERSAL_ARCHITECT_VERSION')) continue;

            const marker = target.path.includes('ai_engine_core') ? '// --- [AI Engine Logic] ---' : '// --- [Main Run Tool Loop] ---';
            if (!patched.includes(marker)) throw new Error(`Marker not found in ${target.path}: ${marker}`);
            patched = patched.replace(marker, `${engine}\n\n${marker}`);

            if (!patched.includes('"architecture_loop"')) {
              if (!patched.includes('CORE: [')) throw new Error(`CORE tool group not found in ${target.path}`);
              patched = patched.replace('CORE: [', 'CORE: ["architecture_loop", ');
            }

            if (!patched.includes('name: "architecture_loop"')) {
              const token = '        { name: "discovery_scan",';
              if (!patched.includes(token)) throw new Error(`Discovery tool declaration token not found in ${target.path}`);
              patched = patched.replace(token, `        ${declaration},\n${token}`);
            }

            if (!patched.includes('universal_architecture_loop')) {
              const responseToken = '  "response_style":';
              if (!patched.includes(responseToken)) throw new Error(`Constitution response_style marker not found in ${target.path}`);
              patched = patched.replace(responseToken, '  "universal_architecture_loop": "For non-trivial engineering tasks execute the Universal Architect Loop: Discovery -> Architecture Understanding -> Constraint Analysis -> Architecture Planning -> Design -> Cross-file Implementation -> Validation -> Repair. Treat the returned architecture model as the source of truth, inspect before writing, validate after coherent batches, and re-scan after changes.",\n  "response_style":');
            }

            if (!patched.includes('else if (name === "architecture_loop")')) {
              if (!patched.includes(target.discoveryBranch)) throw new Error(`Discovery branch text not found in ${target.path}`);
              const archBranch = `else if (name === "architecture_loop") {\n                try {\n                    const scanResult = ${target.architectureCall};\n                    toolResult = runUniversalArchitectLoop(scanResult, { environment: "${target.environment}", objective: args?.objective || "", constraints: args?.constraints || {} });\n                } catch (architectureError) {\n                    toolResult = { error: "Universal architecture loop failed.", details: architectureError?.message || String(architectureError) };\n                }\n            }`;
              patched = patched.replace(target.discoveryBranch, `${target.discoveryBranch}\n            ${archBranch}`);
            }

            fs.writeFileSync(target.path, patched, 'utf8');
          }
          NODE

      - name: Validate JavaScript
        run: |
          node --check my_AI/ai_engine_core.js
          node --check my_AI/universal_architect_engine.js
          node --check Mastermind_Desktop/core.js
          node --check Mastermind_Desktop/universal_architect_engine.js

      - name: Copy shared architect engine and commit
        shell: bash
        run: |
          cp my_AI/universal_architect_engine.js Mastermind_Desktop/universal_architect_engine.js
          git add my_AI/ai_engine_core.js my_AI/universal_architect_engine.js Mastermind_Desktop/core.js Mastermind_Desktop/universal_architect_engine.js
          git rm .github/workflows/upgrade_universal_architect_loop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Upgrade Universal Architect Loop"
          git push
