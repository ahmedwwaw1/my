name: Install Universal Skill System
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Integrate skill system
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const targets=[
            {core:'my_AI/ai_engine_core.js',skill:'my_AI/universal_skill_system.js',env:'cloud'},
            {core:'Mastermind_Desktop/core.js',skill:'Mastermind_Desktop/universal_skill_system.js',env:'desktop'}
          ];
          const toolDecl = `\nconst UNIVERSAL_SKILL_TOOL_DECLARATION = {\n  name: "skill_manager",\n  description: "Universal Skill System: list, inspect, validate, install, activate, deactivate, quarantine, compose, import or build declarative expert skills. Skills are evidence-driven definitions; arbitrary code execution is forbidden.",\n  parameters: { type: "OBJECT", properties: {\n    action: { type: "STRING", enum: ["list","inspect","validate","register","activate","deactivate","quarantine","remove","compose","build","import_github","import_local"] },\n    skillId: { type: "STRING" },\n    repository: { type: "STRING" },\n    path: { type: "STRING" },\n    ref: { type: "STRING" },\n    task: { type: "STRING" },\n    maxSkills: { type: "INTEGER" },\n    definition: { type: "OBJECT" },\n    source: { type: "OBJECT" },\n    name: { type: "STRING" },\n    id: { type: "STRING" },\n    version: { type: "STRING" },\n    description: { type: "STRING" },\n    domain: { type: "STRING" },\n    triggers: { type: "ARRAY", items: { type: "STRING" } },\n    tags: { type: "ARRAY", items: { type: "STRING" } },\n    instructions: { type: "ARRAY", items: { type: "STRING" } },\n    workflow: { type: "ARRAY", items: { type: "OBJECT" } },\n    capabilities: { type: "ARRAY", items: { type: "OBJECT" } }\n  }, required: ["action"] }\n};\n`;
          for(const t of targets){
            let core=fs.readFileSync(t.core,'utf8');
            const engine=fs.readFileSync(t.skill,'utf8');
            if(!core.includes('UNIVERSAL_SKILL_SYSTEM_VERSION')) core += '\n\n/* --- Integrated Universal Skill System --- */\n' + engine + '\n';
            if(!core.includes('const UNIVERSAL_SKILL_TOOL_DECLARATION')) core += toolDecl;
            if(!core.includes('Universal Skill System constitution contract')){
              const constitutionNeedle='  "memory": "Use Sovereign Memory only for durable engineering patterns or user-approved knowledge.';
              if(core.includes(constitutionNeedle)){
                core=core.replace(constitutionNeedle,
                  '  "universal_skill_system": "Skills are first-class declarative capabilities. Discover existing skills before creating duplicates; validate provenance, schema, safety, version, workflow, and evidence requirements before activation. Skills may be imported from GitHub or local files, composed for a task, disabled or quarantined, and upgraded without allowing arbitrary skill code execution.\",\n'+constitutionNeedle);
                core=core.replace('"universal_skill_system": "Skills are first-class declarative capabilities.','"Universal Skill System constitution contract": true,\n  "universal_skill_system": "Skills are first-class declarative capabilities.');
              }
            }
            // Make the skill manager discoverable without an extra model round trip.
            const coreMarker='CORE: [';
            const mi=core.indexOf(coreMarker);
            if(mi>=0 && !core.slice(mi,mi+100).includes('skill_manager')) core=core.slice(0,mi)+core.slice(mi).replace(coreMarker,'CORE: ["skill_manager", ');
            // Add declaration after AI_TOOLS is constructed.
            const bootstrap = `\n/* --- Universal Skill System runtime bridge --- */\n(function(){\n  if (typeof AI_TOOLS !== 'undefined' && AI_TOOLS[0]?.function_declarations && !AI_TOOLS[0].function_declarations.some(x=>x.name==='skill_manager')) AI_TOOLS[0].function_declarations.push(UNIVERSAL_SKILL_TOOL_DECLARATION);\n  if (typeof TOOL_GROUPS !== 'undefined' && !TOOL_GROUPS.SKILL_SYSTEM) TOOL_GROUPS.SKILL_SYSTEM=['skill_manager'];\n})();\n`;
            if(!core.includes('Universal Skill System runtime bridge')) core += bootstrap;
            // Wire the real tool execution into the existing runToolLoop fallback branch.
            const li=core.indexOf('async function runToolLoop');
            if(li>=0 && core.indexOf('universalSkillManager(',li)<0){
              const fi=core.indexOf('else toolResult =',li);
              if(fi>=0){
                const semi=core.indexOf(';',fi);
                if(semi>=0){
                  const old=core.slice(fi,semi+1);
                  const replacement=`else if (name === "skill_manager") toolResult = await universalSkillManager(args?.action || "list", args || {}, {\n    fetchText: async ({repository,path,ref}) => {\n      const endpoint = \`https://api.github.com/repos/\${repository}/contents/\${path}?ref=\${encodeURIComponent(ref || "main")}\`;\n      const data = await callBridge("github", { endpoint, method: "GET" });\n      const raw = data?.content ? atob(String(data.content).replace(/\\s/g, "")) : (typeof data === "string" ? data : JSON.stringify(data));\n      try { return decodeURIComponent(escape(raw)); } catch (_) { return raw; }\n    },\n    readText: async path => {\n      if (typeof getGithubFileContent === "function") return await getGithubFileContent(path);\n      if (typeof callLocalBridge === "function") return await callLocalBridge("read", { path });\n      return "";\n    }\n  }); ${old.slice('else '.length)}`;
                  core=core.slice(0,fi)+replacement+core.slice(semi+1);
                }
              }
            }
            fs.writeFileSync(t.core,core);
          }
          NODE
      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check my_AI/universal_skill_system.js
          node --check Mastermind_Desktop/universal_skill_system.js
          node --check my_AI/ai_engine_core.js
          node --check Mastermind_Desktop/core.js
      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/install_universal_skill_system.yml
          git add my_AI/universal_skill_system.js Mastermind_Desktop/universal_skill_system.js my_AI/ai_engine_core.js Mastermind_Desktop/core.js
          git commit -m "Add Universal Skill System to cloud and desktop agents"
          git push origin HEAD:main
