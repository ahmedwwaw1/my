name: تشغيل سكربت العملات كل 30 دقيقة

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  crypto-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v3
      
      - name: تثبيت Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install ccxt
      
      - name: تشغيل السكربت
        run: python crypto_bot.py
      
      - name: حفظ التنبيهات
        run: |
          git config user.name "Crypto Bot"
          git config user.email "bot@github.com"
          git add crypto_alerts.json
          git commit -m "🤖 تحديث تنبيهات العملات" || echo "لا توجد تغييرات"
          git push
