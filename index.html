<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSA Academy - العقل المدبر</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .calculator-widget { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 20px rgba(0,255,136,0.2); border: 1px solid #334155; }
        .calculator-widget h3 { margin-top: 0; color: #00ff88; text-align: center; }
        .calculator-widget input, .calculator-widget select { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .calculator-widget button { width: 100%; padding: 12px; background: #00ff88; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .calculator-widget button:hover { background: #00cc6a; }
        .result-box { margin-top: 15px; padding: 10px; background: #0f172a; border-radius: 6px; text-align: center; font-size: 16px; color: #38bdf8; border: 1px dashed #475569; line-height: 1.6; }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #00ff88;">أهلاً بك في VSA Academy</h1>
    
    <!-- الحاسبة الذكية الظاهرة في واجهة الموقع -->
    <div class="calculator-widget">
        <h3>🧮 حاسبة التداول المتقدمة</h3>
        <label>رأس المال ($):</label>
        <input type="number" id="capital" value="1000">
        
        <label>نسبة المخاطرة (%):</label>
        <input type="number" id="riskPercent" value="2">
        
        <label>سعر الدخول:</label>
        <input type="number" id="entryPrice" value="100">
        
        <label>وقف الخسارة:</label>
        <input type="number" id="stopLoss" value="95">
        
        <button onclick="calculateTrade()">حساب حجم الصفقة والأهداف</button>
        
        <div class="result-box" id="calcResult">
            قم بإدخال البيانات واضغط حساب
        </div>
    </div>

    <script>
        function calculateTrade() {
            const capital = parseFloat(document.getElementById('capital').value);
            const riskPercent = parseFloat(document.getElementById('riskPercent').value);
            const entry = parseFloat(document.getElementById('entryPrice').value);
            const sl = parseFloat(document.getElementById('stopLoss').value);

            if (!capital || !riskPercent || !entry || !sl) {
                document.getElementById('calcResult').innerHTML = "الرجاء تعبئة كافة الحقول بشكل صحيح!";
                return;
            }

            const riskAmount = capital * (riskPercent / 100);
            const riskPerShare = Math.abs(entry - sl);

            if (riskPerShare === 0) {
                document.getElementById('calcResult').innerHTML = "سعر الدخول يساوي وقف الخسارة!";
                return;
            }

            const positionSize = riskAmount / riskPerShare;
            const target1 = entry + (riskPerShare * 2);
            const target2 = entry + (riskPerShare * 3);

            document.getElementById('calcResult').innerHTML = `
                مبلغ المخاطرة: <b>$${riskAmount.toFixed(2)}</b><br>
                حجم الوحدات/العقود: <b>${positionSize.toFixed(2)}</b><br>
                الهدف الأول (1:2): <b>$${target1.toFixed(2)}</b><br>
                الهدف الثاني (1:3): <b>$${target2.toFixed(2)}</b>
            `;
        }
    </script>
</body>
</html>
