<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My website</title>
    <style>
        :root {
            --bg-color: #0f0f0f; /* لون خلفية يوتيوب الداكن الرسمي */
            --card-bg: transparent;
            --accent-color: #00d4ff;
            --investment-color: #00ff88;
            --text-main: #f1f1f1;
            --text-dim: #aaa;
            --transition: all 0.2s ease;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            line-height: 1.6;
        }

        /* خلفية النافذة التي تغطي الشاشة بالكامل */
        .modal {
            display: none; 
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100vw; height: 100vh;
            background-color: #1c1c1e; 
        }

        .modal-content {
            background-color: #1c1c1e; 
            margin: 0;                
            padding: 50px;            
            width: 100vw;             
            height: 100vh;            
            border-radius: 0;         
            position: relative;
            overflow-y: auto;         
            box-sizing: border-box;   
        }
        
        /* زر الإغلاق X */
        .close-btn {
            position: absolute;
            top: 20px; left: 25px; 
            color: #aaa;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }
        .close-btn:hover { color: #fff; }

        /* شريط التنقل */
        nav {
            background: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(10px);
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: sticky;
            top: 0; z-index: 1000;
            border-bottom: 1px solid #222;
        }

        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: var(--transition);
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: #272727;
        }

        /* حاوية الموقع - ممتدة بالكامل مثل اليوتيوب من اليمين لليسار */
        .container {
            width: 100%;
            max-width: 100%;
            margin: 2rem 0;
            padding: 0 24px;
            box-sizing: border-box;
        }

        /* محرك البحث */
        .search-container {
            margin-bottom: 2rem;
            padding: 0 24px;
        }

        #globalSearch {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: block;
            padding: 12px 20px;
            border-radius: 40px;
            border: 1px solid #303030;
            background: #121212;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: var(--transition);
        }

        #globalSearch:focus {
            border-color: #1c62b9;
            background: #0f0f0f;
        }

        /* نظام شبكة تباعد وحجم كروت اليوتيوب بالضبط */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            row-gap: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        /* تصميم البطاقة كصورة مصغرة لليوتيوب - بدون تحرك عند التمرير */
        .card {
            background: transparent; 
            border: none;
            border-radius: 0;
            padding: 0;           
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.2s ease;
        }

        .card:hover {
            transform: none;    
            box-shadow: none; 
            opacity: 0.9;
        }

        /* أبعاد الميديا الثابتة بدقة 16:9 كاليوتيوب */
        .card-media-top {
            width: 100%;
            aspect-ratio: 16 / 9;     
            border-radius: 12px;      
            overflow: hidden;
            background-color: #000;
            position: relative;
        }

        .card-media-top img, 
        .card-media-top iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;        
            border: none;
        }

        /* حاوية النصوص أسفل الصورة */
        .card-body-container {
            padding: 4px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card h3 { 
            margin: 0; 
            color: #fff; 
            font-size: 1.1rem; 
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .card-content { 
            color: var(--text-dim); 
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* حد أقصى سطرين كتعليقات يوتيوب المصغرة */
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: normal;
        }

        #statusMsg { text-align: center; color: var(--text-dim); margin-top: 20px; font-size: 1.1rem; }

        /* تنسيق الفيديو داخل المودال */
        .video-wrapper { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 12px; 
            background: #000; 
        }

        .video-wrapper iframe { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            border: none; 
        }

        /* لوحة الأتمتة العلوية */
        .automation-panel {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px 20px;
            width: calc(100% - 48px);
            max-width: 1100px;
            margin: 20px auto;
            color: #fff;
            box-sizing: border-box;
        }
        .automation-panel h4 {
            margin-top: 0;
            margin-bottom: 12px;
            color: #0088cc;
        }
        .panel-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .panel-controls select, .panel-controls input {
            background-color: #0f0f0f;
            border: 1px solid #3f3f3f;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .panel-controls select { flex: 1; min-width: 220px; }
        .panel-controls input { flex: 2; min-width: 300px; }
        .panel-controls button {
            background-color: #f1f1f1;
            color: #0f0f0f;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }
        .panel-controls button:hover { background-color: #d9d9d9; }
    </style>
</head>
<body>

<nav>
    <a href="#/" id="btn-vsa">📊 قسم VSA والتحليل</a>
    <a href="#/investment" id="btn-invest">🏢 قسم الاستثمار</a>
    <a href="#/videos" id="btn-videos">🎥 أكاديمية الفيديوهات</a>
</nav>

<div class="container">
    <div class="search-container">
        <input type="text" id="globalSearch" placeholder="ابحث في أكاديمية الفيديوهات والإشارات والشركات...">
    </div>

    <div class="automation-panel">
        <h4>🛠️ لوحة الأتمتة الذكية للصور</h4>
        <div class="panel-controls">
            <select id="cardSelect" onchange="onCardSelectChange()">
                <option value="">اختر اسم البطاقة لتغيير صورتها...</option>
            </select>
            <input type="text" id="panelImageUrl" placeholder="قم بلصق رابط الصورة الجديد هنا...">
            <button onclick="updateImageAutomation()">تحديث الصورة فوراً 🚀</button>
        </div>
    </div>

    <h1 id="pageTitle" style="text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem;"></h1>
    <div id="statusMsg"></div>
    <div class="grid-layout" id="mainGrid"></div>
</div>

<script>
    let allData = []; 
    
    const grid = document.getElementById('mainGrid');
    const searchInput = document.getElementById('globalSearch');
    const pageTitle = document.getElementById('pageTitle');
    const statusMsg = document.getElementById('statusMsg');

    // دالة تحميل البيانات المستقرة والمربوطة بالـ localStorage
    async function loadWebsiteData() {
        try {
            const localData = localStorage.getItem('my_cards_data');
            
            if (localData && localData !== '[]' && localData !== 'undefined') {
                allData = JSON.parse(localData);
                console.log("🚀 تم تحميل البيانات المحدثة بنجاح.");
                populateCardSelect(); // تعبئة قائمة الأتمتة بالبيانات الكاملة فوراً ولأمرة واحدة لتثبيتها وعزلها
                if (typeof handleRoute === 'function') {
                    handleRoute();
                }
            } else {
                const response = await fetch('data.json');
                if (!response.ok) {
                    throw new Error(`فشل الاتصال بالملف: ${response.status}`);
                }
                
                allData = await response.json();
                
                allData.forEach((item, index) => {
                    item.id = index + 1;
                });
                
                localStorage.setItem('my_cards_data', JSON.stringify(allData));
                populateCardSelect();
                
                if (typeof handleRoute === 'function') {
                    handleRoute();
                }
            }
        } catch (error) {
            console.error("❌ خطأ في جلب قاعدة البيانات:", error);
            if (grid) {
                grid.innerHTML = `
                    <div style="color: #ff4d4d; text-align: center; width: 100%; padding: 40px; font-size: 18px;">
                        ⚠️ عذراً، فشل تحميل محتوى البطاقات من ملف data.json.
                    </div>`;
            }
        }
    }

    // بناء الكروت لعرضها بالواجهة الرئيسية بشكل نظيف (صورة، عنوان، وصف فقط)
    function render(dataArray) {
        const mainGrid = document.getElementById('mainGrid');
        if (!mainGrid) return; 

        mainGrid.innerHTML = ''; 

        if (!dataArray || dataArray.length === 0) {
            mainGrid.innerHTML = `
                <div style="color: #aaa; text-align: center; width: 100%; padding: 50px; font-size: 18px;">
                    لا توجد بطاقات معروضة في هذا القسم حالياً.
                </div>`;
            return;
        }

        dataArray.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('onclick', `openDetails(${item.id})`);
            
            let mediaContent = '';
            
            if (item.image && item.image.trim() !== '') {
                mediaContent = `<div class="card-media-top"><img src="${item.image}" alt="${item.title || ''}"></div>`;
            } else if (item.videoUrl) {
                if (item.videoUrl.includes('youtube') || item.videoUrl.includes('youtu.be')) {
                    mediaContent = `<div class="card-media-top">${getYouTubeEmbed(item.videoUrl)}</div>`;
                } else if (item.videoUrl.includes('t.me')) {
                    mediaContent = `<div class="card-media-top">${getTelegramLink(item.videoUrl)}</div>`;
                }
            }
            
            if (!mediaContent) {
                mediaContent = `<div class="card-media-top"><img src="https://via.placeholder.com/340x170/222/0088cc?text=No+Media" alt="No Media"></div>`;
            }

            card.innerHTML = `
                ${mediaContent}
                <div class="card-body-container">
                    <h3>${item.title || 'بدون عنوان'}</h3>
                    <div class="card-content">${item.content || ''}</div>
                </div>
            `;
            mainGrid.appendChild(card);
        });
    }

    // دالة تعبئة قائمة الأتمتة تعتمد بشكل ثابت على قاعدة البيانات الشاملة لمنع حدوث أي خطأ تفريغ
    function populateCardSelect() {
        const select = document.getElementById('cardSelect');
        if (!select) return;
        
        const currentSelectedValue = select.value; 
        select.innerHTML = '<option value="">اختر اسم البطاقة لتغيير صورتها...</option>';
        
        allData.forEach(item => {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = item.title; 
            select.appendChild(option);
        });
        
        select.value = currentSelectedValue;
    }

    function onCardSelectChange() {
        const select = document.getElementById('cardSelect');
        const input = document.getElementById('panelImageUrl');
        const cardId = parseInt(select.value);
        
        if (!cardId) {
            input.value = '';
            return;
        }
        
        const item = allData.find(i => i.id === cardId);
        if (item) {
            input.value = item.image || ''; 
        }
    }

    function updateImageAutomation() {
        const select = document.getElementById('cardSelect');
        const input = document.getElementById('panelImageUrl');
        if (!select || !input) return;

        const cardId = parseInt(select.value);
        const newUrl = input.value.trim();
        
        if (!cardId) {
            alert('الرجاء اختيار اسم البطاقة أولاً من القائمة المنسدلة!');
            return;
        }
        
        const item = allData.find(i => i.id === cardId);
        if (item) {
            item.image = newUrl; // تم إزالة تصفير الرابط الآخر لحماية روابط اليوتيوب والتليجرام من الحذف والضياع
            
            localStorage.setItem('my_cards_data', JSON.stringify(allData));
            
            if (typeof handleRoute === 'function') {
                handleRoute();
            }
            
            input.value = ''; 
            alert(`🚀 تم تحديث وأتمتة صورة بطاقة "${item.title}" وتثبيتها بنجاح!`);
        }
    }

    // نظام التنقل
    function handleRoute() {
        const hash = window.location.hash || '#/';
        if (searchInput) searchInput.value = ''; 

        if (hash === '#/investment') {
            const filtered = allData.filter(d => d.category === 'invest');
            pageTitle.innerText = 'دليل الاستثمار في العراق';
            render(filtered);
            setActiveNav('btn-invest');
        } 
        else if (hash === '#/videos') {
            const filtered = allData.filter(d => d.category === 'videos');
            pageTitle.innerText = 'مكتبة الشروحات والفيديوهات التعليمية';
            render(filtered);
            setActiveNav('btn-videos');
        } 
        else {
            const filtered = allData.filter(d => d.category === 'vsa');
            pageTitle.innerText = 'أكاديمية VSA والتداول';
            render(filtered);
            setActiveNav('btn-vsa');
        }
    }

    function setActiveNav(id) {
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        const activeLink = document.getElementById(id);
        if (activeLink) activeLink.classList.add('active');
    }

    // محرك البحث
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (term === '') { handleRoute(); return; }

            const results = allData.filter(item => 
                (item.title && item.title.toLowerCase().includes(term)) || 
                (item.content && item.content.toLowerCase().includes(term))
            );
            pageTitle.innerText = 'نتائج البحث في كل الأقسام';
            render(results);
        });
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('load', handleRoute);
    document.addEventListener('DOMContentLoaded', loadWebsiteData);

    // دالة فتح النافذة وعرض كافة المكونات الداخلية (النص الكامل، الفيديوهات، والروابط)
    function openDetails(id) {
        const selectedItem = allData.find(item => item.id === id);

        if (selectedItem) {
            document.getElementById('modalTitle').innerText = selectedItem.title || '';
            document.getElementById('modalContent').innerText = selectedItem.content || '';

            const videoContainer = document.getElementById('modalVideoContainer');
            const linksContainer = document.getElementById('modalLinksContainer');
            
            videoContainer.innerHTML = '';
            linksContainer.innerHTML = '';

            // 1. عرض الفيديو الأساسي بداخل النافذة المنبثقة إن وجد
            if (selectedItem.videoUrl) {
                if (selectedItem.videoUrl.includes('youtube') || selectedItem.videoUrl.includes('youtu.be')) {
                    const embedHtml = getYouTubeEmbed(selectedItem.videoUrl);
                    if (embedHtml) {
                        videoContainer.innerHTML = embedHtml;
                        setupResizeHandles(videoContainer); // تشغيل ميزة التحجيم بالماوس هندسياً
                    }
                } else if (selectedItem.videoUrl.includes('t.me')) {
                    videoContainer.innerHTML = getTelegramLink(selectedItem.videoUrl);
                }
            } 
            // 2. إذا لم يتوافر فيديو وكانت هناك صورة، يتم عرض الصورة بحجم كامل مميز داخل النافذة الكبيرة أيضاً
            else if (selectedItem.image && selectedItem.image.trim() !== '') {
                videoContainer.innerHTML = `<img src="${selectedItem.image}" style="width:100%; max-height:450px; object-fit:contain; border-radius:12px; display:block; margin:0 auto;">`;
            }

            // 3. حقن وعرض الأزرار والروابط في المحتوى الداخلي للنافذة الكبيرة بدقة فخمة
            if (selectedItem.links && selectedItem.links.length > 0) {
                selectedItem.links.forEach(link => {
                    const linkBtn = document.createElement('a');
                    linkBtn.href = link.url;
                    linkBtn.target = '_blank';
                    linkBtn.innerText = link.text;
                    linkBtn.style = 'display: inline-block; padding: 12px 24px; margin-top: 15px; margin-left: 12px; background-color: #0088cc; color: #ffffff; text-decoration: none; border-radius: 25px; font-weight: bold; transition: background 0.2s;';
                    linkBtn.onmouseover = () => linkBtn.style.backgroundColor = '#006699';
                    linkBtn.onmouseout = () => linkBtn.style.backgroundColor = '#0088cc';
                    linksContainer.appendChild(linkBtn);
                });
            }

            document.getElementById('myModal').style.display = "block";
        }
    }

    // دالة بناء مقابض التحجيم التفاعلية بالماوس للفيديو داخل المودال
    function setupResizeHandles(container) {
        const handles = {
            'r': 'ew-resize', 'l': 'ew-resize', 'b': 'ns-resize', 't': 'ns-resize',
            'rb': 'nwse-resize', 'lb': 'nesw-resize', 'rt': 'nesw-resize', 'lt': 'nwse-resize'
        };

        for (const [handleType, cursor] of Object.entries(handles)) {
            const handle = document.createElement('div');
            handle.className = `resize-handle resize-handle-${handleType}`;
            handle.style.position = 'absolute';
            handle.style.cursor = cursor;
            handle.style.zIndex = '1000'; 
            const size = 12; 
            
            if (handleType === 'r') {
                handle.style.width = `${size}px`; handle.style.height = '100%';
                handle.style.right = `-${size / 2}px`; handle.style.top = '0';
            } else if (handleType === 'l') {
                handle.style.width = `${size}px`; handle.style.height = '100%';
                handle.style.left = `-${size / 2}px`; handle.style.top = '0';
            } else if (handleType === 'b') {
                handle.style.height = `${size}px`; handle.style.width = '100%';
                handle.style.bottom = `-${size / 2}px`; handle.style.left = '0';
            } else if (handleType === 't') {
                handle.style.height = `${size}px`; handle.style.width = '100%';
                handle.style.top = `-${size / 2}px`; handle.style.left = '0';
            } else {
                handle.style.width = `${size}px`; handle.style.height = `${size}px`;
                handle.style[handleType.includes('r') ? 'right' : 'left'] = `-${size / 2}px`;
                handle.style[handleType.includes('b') ? 'bottom' : 'top'] = `-${size / 2}px`;
            }

            container.appendChild(handle);

            let isResizing = false;
            let initialX, initialY, initialWidth, initialHeight;
            const aspectRatio = 16 / 9;

            handle.addEventListener('mousedown', (e) => {
                isResizing = true;
                initialX = e.clientX;
                initialY = e.clientY;
                initialWidth = container.offsetWidth;
                initialHeight = container.offsetHeight;
                document.body.style.userSelect = 'none';
                document.body.style.cursor = cursor;
                const iframe = container.querySelector('iframe');
                if (iframe) iframe.style.pointerEvents = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isResizing) return; 
                const deltaX = e.clientX - initialX;
                const deltaY = e.clientY - initialY;
                let newWidth = initialWidth;
                let newHeight = initialHeight;

                if (handleType === 'r') {
                    newWidth = initialWidth + deltaX * 2;
                    newHeight = newWidth / aspectRatio;
                } else if (handleType === 'l') {
                    newWidth = initialWidth - deltaX * 2;
                    newHeight = newWidth / aspectRatio;
                } else if (handleType === 'b') {
                    newHeight = initialHeight + deltaY * 2;
                    newWidth = newHeight * aspectRatio;
                } else if (handleType === 't') {
                    newHeight = initialHeight - deltaY * 2;
                    newWidth = newHeight * aspectRatio;
                } else if (handleType === 'rb' || handleType === 'rt') {
                    newWidth = initialWidth + deltaX * 2;
                    newHeight = newWidth / aspectRatio;
                } else if (handleType === 'lb' || handleType === 'lt') {
                    newWidth = initialWidth - deltaX * 2;
                    newHeight = newWidth / aspectRatio;
                }

                const minWidthLimit = 280;
                const maxWidthLimit = container.parentElement.offsetWidth - 10;

                if (newWidth >= minWidthLimit && newWidth <= maxWidthLimit) {
                    container.style.width = newWidth + 'px';
                }
            });

            window.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                    const iframe = container.querySelector('iframe');
                    if (iframe) iframe.style.pointerEvents = 'auto';
                }
            });
        }
    }

    function closeModal() {
        document.getElementById('myModal').style.display = "none";
    }

    window.onclick = function(event) {
        const modal = document.getElementById('myModal');
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }

    function getYouTubeEmbed(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) 
        ? `<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${match[2]}" frameborder="0" allowfullscreen></iframe></div>` 
        : null;
    }

    function getTelegramLink(url) {
        return `<div style="margin:15px 0; padding:15px; background:rgba(0, 136, 204, 0.1); border-radius:12px; text-align:center;">
                    <a href="${url}" target="_blank" style="color:#0088cc; font-weight:bold; text-decoration:none;">
                        🎥 مشاهدة الفيديو المباشر عبر تطبيق تلجرام
                    </a>
                </div>`;
    }
</script>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h1 id="modalTitle" style="color: #0088cc; margin-top: 20px; font-size: 2rem;"></h1>
