<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSA Academy - العقل المدبر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: #00ff88;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* تنسيق الحاسبة العائمة الذكية */
        #vsa-calculator-widget {
          position: fixed;
          bottom: 20px;
          right: 20px;
          background: linear-gradient(135deg, #1a1a2e, #16213e);
          border: 2px solid #00ff88;
          border-radius: 15px;
          padding: 15px;
          box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
          z-index: 99999;
          width: 320px;
          color: #fff;
          font-family: 'Cairo', sans-serif;
          direction: rtl;
          backdrop-filter: blur(10px);
          animation: pulseGlow 3s infinite;
        }

        @keyframes pulseGlow {
          0% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
          50% { box-shadow: 0 0 25px rgba(0, 255, 136, 0.6); }
          100% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
        }

        #vsa-calculator-widget h3 {
          margin: 0 0 10px 0;
          font-size: 16px;
          color: #00ff88;
          text-align: center;
          border-bottom: 1px solid rgba(255,255,255,0.1);
          padding-bottom: 5px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        #vsa-calculator-widget .calc-body label {
          display: block;
          font-size: 12px;
          margin-bottom: 3px;
          color: #b8c1ec;
        }

        #vsa-calculator-widget .calc-body input {
          width: 100%;
          padding: 6px 10px;
          margin-bottom: 8px;
          background: #0f172a;
          border: 1px solid #334155;
          border-radius: 6px;
          color: #fff;
          font-size: 13px;
          box-sizing: border-box;
        }

        #vsa-calculator-widget .calc-body button {
          width: 100%;
          background: #00ff88;
          color: #0f172a;
          border: none;
          padding: 8px;
          border-radius: 6px;
          font-weight: bold;
          cursor: pointer;
          transition: 0.3s;
        }

        #vsa-calculator-widget .calc-body button:hover {
          background: #00cc6a;
        }

        #vsa-calculator-widget .calc-result {
          margin-top: 10px;
          background: #0f172a;
          padding: 8px;
          border-radius: 6px;
          font-size: 13px;
          text-align: center;
          border: 1px dashed #00ff88;
          color: #00ff88;
        }

        #vsa-calculator-widget .toggle-calc {
          background: none;
          border: none;
          color: #00ff88;
          cursor: pointer;
          font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>VSA Academy</h1>
        <p>منصة التحليل الحجمي والزمني المتقدمة</p>
    </header>
    <div class="container">
        <h2>مرحباً بك في منصة السيادة التكنولوجية</h2>
        <p>تم تفعيل الحاسبة الذكية لإدارة رأس المال والمخاطر بنجاح في ركن الشاشة لتكون متاحاً لك في كل لحظة.</p>
    </div>

    <!-- الحاسبة العائمة الذكية -->
    <div id="vsa-calculator-widget">
        <h3>
            <span>🧮 حاسبة المخاطر VSA</span>
            <button class="toggle-calc" onclick="toggleCalcBody()">_</button>
        </h3>
        <div class="calc-body" id="calcBody">
            <label>رأس المال (USDT):</label>
            <input type="number" id="calcCapital" value="1000" placeholder="رأس المال">
            
            <label>نسبة المخاطرة (%):</label>
            <input type="number" id="calcRisk" value="2" placeholder="نسبة المخاطرة">
            
            <label>نقاط وقف الخسارة (Pips/Points):</label>
            <input type="number" id="calcStopLoss" value="20" placeholder="نقاط الاستوب">
            
            <button onclick="calculateVSA()">احسْب حجم العقد</button>
            
            <div class="calc-result" id="calcResult">
                النتيجة ستظهر هنا...
            </div>
        </div>
    </div>

    <script>
        function toggleCalcBody() {
            const body = document.getElementById('calcBody');
            body.style.display = body.style.display === 'none' ? 'block' : 'none';
        }

        function calculateVSA() {
            const capital = parseFloat(document.getElementById('calcCapital').value) || 0;
            const riskPercent = parseFloat(document.getElementById('calcRisk').value) || 0;
            const stopLoss = parseFloat(document.getElementById('calcStopLoss').value) || 1;

            const riskAmount = (capital * riskPercent) / 100;
            const lotSize = riskAmount / stopLoss;

            document.getElementById('calcResult').innerHTML = 
                `مبلغ المخاطرة: <b>${riskAmount.toFixed(2)} $</b><br>` +
                `حجم العقد المقترح: <b>${lotSize.toFixed(4)}</b>`;
        }
    </script>
</body>
</html>
