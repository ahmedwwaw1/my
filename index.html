<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My website</title>
    <style>
        /* خلفية النافذة التي تغطي الشاشة وتجعلها شبه شفافة */
    .modal {
    display: none; /* مخفية تلقائياً */
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.7); /* تعتيم الخلفية */
    backdrop-filter: blur(5px); /* تأثير ضبابي احترافي */
    }

    /* هذا التعديل يجعل النافذة تأخذ كامل مساحة المتصفح */
    .modal-content {
    background-color: #1c1c1e; /* لون الخلفية */
    margin: 0;                /* إزالة المسافات الخارجية */
    padding: 50px;            /* مسافة داخلية مريحة للنص */
    width: 100vw;             /* العرض يساوي عرض المتصفح بالكامل */
    height: 100vh;            /* الارتفاع يساوي ارتفاع المتصفح بالكامل */
    border-radius: 0;         /* إزالة الزوايا الدائرية لتكون حادة كصفحة كاملة */
    position: relative;
    overflow-y: auto;         /* لجعل المحتوى قابلاً للتمرير إذا كان طويلاً جداً */
    box-sizing: border-box;   /* لضمان عدم خروج النافذة عن الحدود */
    }

    /* تعديل إضافي بسيط للـ modal نفسها */
    .modal {
    background-color: #1c1c1e; /* توحيد لون الخلفية مع لون الموقع */
    }
    /* زر الإغلاق X */
    .close-btn {
    position: absolute;
    top: 15px; left: 20px; /* جهة اليسار لأن موقعك باللغة العربية */
    color: #aaa;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    }
    .close-btn:hover { color: #fff; }
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00d4ff;
            --investment-color: #00ff88;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            line-height: 1.6;
        }

        /* شريط التنقل */
        nav {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: sticky;
            top: 0; z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: var(--transition);
        }

        nav a:hover, nav a.active {
            color: var(--accent-color);
            background: rgba(0, 212, 255, 0.1);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        /* محرك البحث */
        .search-container {
            margin-bottom: 2rem;
        }

        #globalSearch {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: 2px solid #333;
            background: var(--card-bg);
            color: white;
            font-size: 1.2rem;
            outline: none;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        #globalSearch:focus {
            border-color: var(--accent-color);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        /* تصميم البطاقة */
   /* التنسيق النهائي المتطابق كلياً مع الطول والتظليل المحيط */
.card {
    background-color: #18181c;
    border-radius: 12px;
    padding: 0;                /* جعل البادينج صفر لكي تلتصق حاوية الصورة بالحواف تماماً */
    width: 100%;
    max-width: 340px;          /* العرض المطابق لقياسك */
    min-height: 365px;         /* الطول المنسق بدقة مع مسطرة الـ Notepad الخاصة بك */
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    
    /* التظليل الافتراضي الكامل والعميق خلف الكارت بالكامل لمنحه بعداً ثلاثياً */
    border: 1px solid rgba(255, 255, 255, 0.04);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
}

/* التظليل الخافت والعميق والشامل لكل الكارت عند تمرير الماوس مع الحفاظ على الثبات */
.card:hover {
    transform: none;           /* ثبات كامل للكارت بدون أي حركة مفاجئة */
    border-color: rgba(255, 255, 255, 0.12);
    
    /* تظليل منتشر وعريض يملأ المساحة المحيطة بالكامل لمنحه فخامة هادئة */
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75), 
                0 0 25px rgba(0, 0, 0, 0.3); 
}

/* حاوية الميديا العلوية لتظهر في أعلى الكارت وبحجم كبير ممتاز */
.card-media-top {
    width: 100%;
    height: 170px;             /* الارتفاع المثالي لتظهر الصورة واضحة وكبيرة في الأعلى */
    overflow: hidden;
    background-color: #111;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
}

.card-media-top img, 
.card-media-top iframe {
    width: 100%;
    height: 100%;
    object-fit: cover;         /* قص الصورة باحترافية كاملة ومنع تمططها */
    border: none;
}

/* حاوية المحتوى الداخلي لتعويض مسافات البادينج للنصوص أسفل الصورة */
.card-body-container {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    justify-content: space-between; /* توزيع النصوص والأزرار بشكل متناسق عمودياً */
}

/* تنسيق أزرار التحكم بالصور التفاعلية */
.image-controls {
    display: flex;
    gap: 8px;
    margin: 12px 0 6px 0;
}

.btn-control {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: bold;
    cursor: pointer;
    border: none;
    transition: background 0.2s;
}

.btn-add-edit {
    background-color: #0088cc;
    color: white;
}

.btn-add-edit:hover {
    background-color: #006699;
}

.btn-delete {
    background-color: #d9534f;
    color: white;
}

.btn-delete:hover {
    background-color: #c9302c;
}

/* تنسيق سهم الإشارة السفلي */
.card-footer-arrow {
    color: #0088cc;
    font-size: 0.9rem;
    margin-top: 10px;
    text-align: left;
    font-weight: bold;
}

        .badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            align-self: flex-start;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .badge-vsa { background: rgba(0, 212, 255, 0.2); color: var(--accent-color); }
        .badge-invest { background: rgba(0, 255, 136, 0.2); color: var(--investment-color); }

        .card h3 { margin: 10px 0; color: #fff; font-size: 1.3rem; }
        .card-content { color: var(--text-dim); flex-grow: 1; white-space: pre-line; margin-bottom: 15px; }
        
        .card-links { display: flex; flex-wrap: wrap; gap: 10px; border-top: 1px solid #333; padding-top: 15px; }
        .card-links a { 
            color: var(--accent-color); 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: bold; 
            border: 1px solid rgba(0, 212, 255, 0.3); 
            padding: 6px 12px; 
            border-radius: 5px; 
            transition: 0.2s;
        }
        .card-links a:hover { background: var(--accent-color); color: #000; }

        #statusMsg { text-align: center; color: var(--text-dim); margin-top: 20px; font-size: 1.1rem; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* تنسيق الفيديو الاحترافي */
    .video-wrapper { 
        position: relative; 
        padding-bottom: 56.25%; /* هذه النسبة تجعل الفيديو يحافظ على أبعاد 16:9 دائماً */
        height: 0; 
        overflow: hidden; 
        margin-top: 15px; 
        border-radius: 10px; /* يعطي زوايا دائرية جميلة */
        background: #000; 
    }

    .video-wrapper iframe { 
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        border: none; 
    }
    /* تنسيق التلجرام */
    .telegram-btn { 
        margin:15px 0; 
        padding:10px; 
        background:rgba(0, 136, 204, 0.1); 
        border-radius:8px; 
        text-align:center; 
    }
    .telegram-btn a { 
        color:#0088cc; 
        font-weight:bold; 
        text-decoration:none; 
    }
    /* الكود السحري لضبط تباعد الكروت تماماً مثل موقع الدكتور أبو هدهود */
.grid, #grid {
    display: grid;
    /* توزيع تلقائي ذكي يحافظ على حجم الكارت (310px إلى 340px) */
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); 
    gap: 24px;             /* المسافة الاحترافية والمعقولة بين الكروت طولاً وعرضاً */
    padding: 20px;
    max-width: 1140px;     /* تمنع الكروت من التباعد المفرط على الشاشات الكبيرة وتجعلها ملمومة */
    margin: 0 auto;        /* لتوسط الحاوية بالكامل في منتصف الشاشة */
    justify-content: center;
}
    </style>
</head>
<body>
<!-- اضافة زر لأقسام -->
<nav>
    <a href="#/" id="btn-vsa">📊 قسم VSA والتحليل</a>
    <a href="#/investment" id="btn-invest">🏢 قسم الاستثمار</a>
    <a href="#/videos" id="btn-videos">🎥 أكاديمية الفيديوهات</a>
</nav>

<div class="container">
    <div class="search-container">
        <input type="text" id="globalSearch" placeholder="ابحث عن إشارة VSA، شركة استثمار، أو رابط معين...">
    </div>

    <h1 id="pageTitle" style="text-align: center; margin-bottom: 1.5rem;"></h1>
    <div id="statusMsg"></div>
    <div class="grid-layout" id="mainGrid"></div>
</div>

<script>
    // --- قاعدة البيانات (أضف محتواك هنا دائماً بنفس التنسيق) ---
    // 1. تعريف المتغير العام لحفظ البيانات بعد جلبها
let allData = [];

// 2. جلب البيانات ديناميكياً من الملف الخارجي الجديد
fetch('data.json')
    .then(response => response.json())
    .then(jsonData => {
        allData = jsonData;

        // ترقيم العناصر تلقائياً لكي تعمل دالة الفتح والعرض بشكل سليم ID: أتمتة الـ
        allData.forEach((item, index) => {
            item.id = index + 1;
        });

        // 🔥 التعديل السحري هنا: بدلاً من عرض كل البيانات مباشرة، نترك التوجيه لـ handleRoute
        // لتقرأ القسم الحالي من الرابط (سواء كنت في الـ Bookmark أو عملت ريفريش) وتعرضه بدقة
        handleRoute();
    })
    .catch(error => {
        console.error("خطأ أثناء تحميل البيانات الديناميكية:", error);
    });
    // دالة اليوتيوب الأصلية
        function getYouTubeEmbed(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) 
            ? `<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${match[2]}" frameborder="0" allowfullscreen></iframe></div>` 
            : null;
       }
    // دالة خاصة لروابط تلجرام
    function getTelegramLink(url) {
    return `<div style="margin:15px 0; padding:10px; background:rgba(0, 136, 204, 0.1); border-radius:8px; text-align:center;">
                <a href="${url}" target="_blank" style="color:#0088cc; font-weight:bold; text-decoration:none;">
                    🎥 مشاهدة الفيديو على تلجرام
                </a>
            </div>`;
    }
    const grid = document.getElementById('mainGrid');
    const searchInput = document.getElementById('globalSearch');
    const pageTitle = document.getElementById('pageTitle');
    const statusMsg = document.getElementById('statusMsg');

// دالة العرض الحديثة والمطابقة لتصميم موقع الدكتور أبو هدهود وهيكليته
function render(data, isSearch = false) {
    grid.innerHTML = '';
    statusMsg.innerHTML = isSearch && data.length > 0 ? `نتيجة: تم العثور على (${data.length})` : '';

    if (data.length === 0) {
        statusMsg.innerHTML = 'عذراً، لم نجد نتائج تطابق بحثك.';
        return;
    }

    data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // جعل الكارت بالكامل يدخل إلى التفاصيل عند النقر
        card.setAttribute('onclick', `openDetails(${item.id})`);
        
        const badgeClass = item.category === 'vsa' ? 'badge-vsa' : 'badge-invest';
        const badgeText = item.category === 'vsa' ? 'VSA & التحليل' : 'استثمار العراق';

        let mediaContent = '';
        if (item.videoUrl) {
            if (item.videoUrl.includes('youtube') || item.videoUrl.includes('youtu.be')) {
                mediaContent = `<div class="card-media-top">${getYouTubeEmbed(item.videoUrl) || ''}</div>`;
            } else if (item.videoUrl.includes('t.me')) {
                mediaContent = `<div class="card-media-top">${getTelegramLink(item.videoUrl)}</div>`;
            }
        }
        
        // 📸 إذا لم يكن هناك فيديو، يتم عرض الصورة في الأعلى تماماً بالحجم الكامل المطور
        if (!mediaContent) {
            const imageSrc = item.image ? item.image : 'https://via.placeholder.com/340x170/222/0088cc?text=VSA+Academy';
            mediaContent = `
                <div class="card-media-top">
                    <img src="${imageSrc}" alt="${item.title}">
                </div>
            `;
        }

        // الهيكل الحديث: الميديا في الأعلى أولاً، ثم حاوية المحتوى والنصوص أسفلها مباشرة
        card.innerHTML = `
            ${mediaContent}
            
            <div class="card-body-container">
                <div>
                    <span class="badge ${badgeClass}">${badgeText}</span>
                    <h3>${item.title}</h3>
                    <div class="card-content">${item.content}</div>
                </div>
                
                <div>
                    <div class="card-links">
                        ${item.links.map(link => `<a href="${link.url}" target="_blank" onclick="event.stopPropagation();">${link.text}</a>`).join('')}
                    </div>
                    
                    <div class="image-controls">
                        <button class="btn-control btn-add-edit" onclick="manageCardImage(event, ${item.id}, 'edit')">📸 إضافة / تبديل</button>
                        <button class="btn-control btn-delete" onclick="manageCardImage(event, ${item.id}, 'delete')">🗑️ حذف</button>
                    </div>
                    
                    <div class="card-footer-arrow">
                        عرض التفاصيل ←
                    </div>
                </div>
            </div>
        `;

        grid.appendChild(card);
    });
}

// 💡 دالة إدارة الصور: تفتح لك نافذة لإدخال الرابط وتحديث الكارت في نفس اللحظة
// دالة إدارة الصور المطورة: تعمل مباشرة على العناصر وتمنع التعارض
function manageCardImage(event, id, action) {
    // 1. منع الحدث من الانتقال للكارت الأب (حل مشكلة عدم الاستجابة والتعارض)
    event.stopPropagation(); 

    // 2. الوصول لوسم الصورة داخل الكارت الذي تم النقر عليه حالياً
    const cardElement = event.target.closest('.card');
    const imgElement = cardElement.querySelector('.card-media-top img');

    if (action === 'edit') {
        const currentSrc = imgElement ? imgElement.src : '';
        const newUrl = prompt('قم بلصق رابط الصورة الجديد (URL) هنا:', currentSrc);
        
        if (newUrl !== null && newUrl.trim() !== '') {
            if (imgElement) {
                // تحديث الصورة فوراً أمامك على الشاشة
                imgElement.src = newUrl.trim();
            } else {
                // في حال لم يكن هناك حاوية صورة (تحديث احتياطي)
                const mediaTop = cardElement.querySelector('.card-media-top');
                if (mediaTop) mediaTop.innerHTML = `<img src="${newUrl.trim()}" alt="صورة">`;
            }
        }
    } 
    
    else if (action === 'delete') {
        if (confirm('هل أنت متأكد من حذف صورة هذا الكارت؟')) {
            if (imgElement) {
                // إرجاع الصورة لصورة افتراضية أنيقة عند الحذف
                imgElement.src = 'https://via.placeholder.com/340x170/222/0088cc?text=VSA+Academy';
            }
        }
    }
}
    // نظام التوجيه
    function handleRoute() {
    const hash = window.location.hash || '#/';
    searchInput.value = ''; // تصفير البحث عند الانتقال

    if (hash === '#/investment') {
        const filtered = allData.filter(d => d.category === 'invest');
        pageTitle.innerText = 'دليل الاستثمار في العراق';
        render(filtered);
        setActiveNav('btn-invest');
        
    } 
    else if (hash === '#/videos') {
        // القسم الجديد الخاص بالفيديوهات فقط
        const filtered = allData.filter(d => d.category === 'videos');
        pageTitle.innerText = 'مكتبة الشروحات والفيديوهات التعليمية';
        render(filtered);
        setActiveNav('btn-videos');
        
    } 
    else {
        // القسم الافتراضي (VSA)
        const filtered = allData.filter(d => d.category === 'vsa');
        pageTitle.innerText = 'أكاديمية VSA والتداول';
        render(filtered);
        setActiveNav('btn-vsa');
    }
}


        function setActiveNav(id) {
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // محرك البحث
    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();
        if (term === '') { handleRoute(); return; }

        const results = allData.filter(item => 
            item.title.toLowerCase().includes(term) || 
            item.content.toLowerCase().includes(term)
        );
        pageTitle.innerText = 'نتائج البحث في كل الأقسام';
        render(results, true);
    });

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('load', handleRoute);
    // دالة فتح النافذة وحقن البيانات فيها داخل نفس الصفحة
function openDetails(id) {
    const selectedItem = allData.find(item => item.id === id);

    if (selectedItem) {
        document.getElementById('modalTitle').innerText = selectedItem.title;
        document.getElementById('modalContent').innerText = selectedItem.content;

        const videoContainer = document.getElementById('modalVideoContainer');
        const linksContainer = document.getElementById('modalLinksContainer');
        
        videoContainer.innerHTML = '';
        linksContainer.innerHTML = '';

        // 1. حقن الفيديو إذا كان موجوداً
        if (selectedItem.videoUrl) {
            const embedHtml = getYouTubeEmbed(selectedItem.videoUrl);
            if (embedHtml) {
                videoContainer.innerHTML = embedHtml;
                
                // 2. تعريف المقابض الشفافة للجهات الثمانية
                const handles = {
                    'r': 'ew-resize', 'l': 'ew-resize', 'b': 'ns-resize', 't': 'ns-resize',
                    'rb': 'nwse-resize', 'lb': 'nesw-resize', 'rt': 'nesw-resize', 'lt': 'nwse-resize'
                };

                for (const [handleType, cursor] of Object.entries(handles)) {
                    const handle = document.createElement('div');
                    handle.className = `resize-handle resize-handle-${handleType}`;
                    handle.style.position = 'absolute';
                    handle.style.cursor = cursor;
                    handle.style.zIndex = '1000'; // جعلها في المقدمة دائماً فوق أي حواف
                    
                    const size = 12; // عرض منطقة السحب الشفافة بالبكسل لتسهيل التقاطها بالماوس
                    
                    // توزيع المقابض على حواف الصندوق بدقة هندسية
                    if (handleType === 'r') {
                        handle.style.width = `${size}px`; handle.style.height = '100%';
                        handle.style.right = `-${size / 2}px`; handle.style.top = '0';
                    } else if (handleType === 'l') {
                        handle.style.width = `${size}px`; handle.style.height = '100%';
                        handle.style.left = `-${size / 2}px`; handle.style.top = '0';
                    } else if (handleType === 'b') {
                        handle.style.height = `${size}px`; handle.style.width = '100%';
                        handle.style.bottom = `-${size / 2}px`; handle.style.left = '0';
                    } else if (handleType === 't') {
                        handle.style.height = `${size}px`; handle.style.width = '100%';
                        handle.style.top = `-${size / 2}px`; handle.style.left = '0';
                    } else {
                        // الزوايا الأربع
                        handle.style.width = `${size}px`; handle.style.height = `${size}px`;
                        handle.style[handleType.includes('r') ? 'right' : 'left'] = `-${size / 2}px`;
                        handle.style[handleType.includes('b') ? 'bottom' : 'top'] = `-${size / 2}px`;
                    }

                    videoContainer.appendChild(handle);

                    // 3. برمجة حركة السحب والتحجيم الذكي
                    let isResizing = false;
                    let initialX, initialY, initialWidth, initialHeight;
                    const aspectRatio = 16 / 9;

                    // دالة تبدأ عند الضغط كليك يسار على الحافة
                    handle.addEventListener('mousedown', (e) => {
                        isResizing = true;
                        initialX = e.clientX;
                        initialY = e.clientY;
                        initialWidth = videoContainer.offsetWidth;
                        initialHeight = videoContainer.offsetHeight;
                        
                        document.body.style.userSelect = 'none';
                        document.body.style.cursor = cursor;

                        // الحل العبقري: تجميد تinteraction الفيديو مؤقتاً لكي لا يسرق حركة الماوس!
                        const iframe = videoContainer.querySelector('iframe');
                        if (iframe) {
                            iframe.style.pointerEvents = 'none';
                        }
                    });

                    // دالة التحجيم أثناء تحريك الماوس (تعمل فقط وفقط إذا كان الزر مضغوطاً)
                    window.addEventListener('mousemove', (e) => {
                        if (!isResizing) return; // إذا لم يكن مضغوطاً، لا تفعل أي شيء مطلقاً
                        
                        const deltaX = e.clientX - initialX;
                        const deltaY = e.clientY - initialY;
                        let newWidth = initialWidth;
                        let newHeight = initialHeight;

                        // معالجة كل اتجاه بشكل منفصل تماماً لضمان عمل اليمين واليسار وكل زاوية
                        if (handleType === 'r') {
                            newWidth = initialWidth + deltaX * 2;
                            newHeight = newWidth / aspectRatio;
                        } else if (handleType === 'l') {
                            newWidth = initialWidth - deltaX * 2;
                            newHeight = newWidth / aspectRatio;
                        } else if (handleType === 'b') {
                            newHeight = initialHeight + deltaY * 2;
                            newWidth = newHeight * aspectRatio;
                        } else if (handleType === 't') {
                            newHeight = initialHeight - deltaY * 2;
                            newWidth = newHeight * aspectRatio;
                        } else if (handleType === 'rb' || handleType === 'rt') {
                            newWidth = initialWidth + deltaX * 2;
                            newHeight = newWidth / aspectRatio;
                        } else if (handleType === 'lb' || handleType === 'lt') {
                            newWidth = initialWidth - deltaX * 2;
                            newHeight = newWidth / aspectRatio;
                        }

                        // تعيين الحدود الدنيا والقصوى المتناسقة لحجم الشاشة
                        const minWidthLimit = 280;
                        const maxWidthLimit = videoContainer.parentElement.offsetWidth - 10;

                        if (newWidth >= minWidthLimit && newWidth <= maxWidthLimit) {
                            videoContainer.style.width = newWidth + 'px';
                        }
                    });

                    // دالة الإيقاف الفوري عند رفع إصبعك عن زر الماوس الأيسر
                    window.addEventListener('mouseup', () => {
                        if (isResizing) {
                            isResizing = false;
                            document.body.style.userSelect = '';
                            document.body.style.cursor = '';

                            // إعادة تفعيل الفيديو فوراً ليعود للعمل الطبيعي والضغط عليه
                            const iframe = videoContainer.querySelector('iframe');
                            if (iframe) {
                                iframe.style.pointerEvents = 'auto';
                            }
                        }
                    });
                }
            }
        }

        // 4. عرض الروابط الملحقة
        if (selectedItem.links && selectedItem.links.length > 0) {
            selectedItem.links.forEach(link => {
                const linkBtn = document.createElement('a');
                linkBtn.href = link.url;
                linkBtn.target = '_blank';
                linkBtn.innerText = link.text;
                linkBtn.style = 'display: inline-block; padding: 10px 20px; marginTop: 10px; marginRight: 10px; backgroundColor: #0088cc; color: #ffffff; textDecoration: none; borderRadius: 5px; fontWeight: bold;';
                linksContainer.appendChild(linkBtn);
            });
        }

        document.getElementById('myModal').style.display = "block";
    }
}

// دالة إغلاق النافذة
function closeModal() {
    document.getElementById('myModal').style.display = "none";
}

// إغلاق النافذة إذا ضغط المستخدم في أي مكان خارج الصندوق
window.onclick = function(event) {
    const modal = document.getElementById('myModal');
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
</script>
<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h1 id="modalTitle" style="color: #0088cc;"></h1>
        <div id="modalContent" style="white-space: pre-line; line-height: 1.8; color: #b0b0b0;"></div>
        
        <div id="modalVideoContainer" style="margin: 20px auto; width: 640px; max-width: 100%; position: relative;"></div>
        <div id="modalLinksContainer" style="margin-top: 20px;"></div>
    </div>
</div>
</div>
</body>
</html>
