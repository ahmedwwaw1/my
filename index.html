<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSA Academy</title>
    <style>
        /* زر تنبيهات الكريبتو باللون الذهبي الدائم */
        #crypto-alerts-btn, 
        .crypto-alert-btn,
        button[onclick*="crypto"],
        .btn-crypto,
        [id*="crypto"] button,
        .crypto-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500) !important;
            color: #1a1a2e !important;
            border-color: #FFD700 !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4) !important;
            font-weight: bold !important;
        }
        #crypto-alerts-btn:hover, 
        .crypto-alert-btn:hover,
        button[onclick*="crypto"]:hover,
        .btn-crypto:hover,
        [id*="crypto"] button:hover,
        .crypto-btn:hover {
            background: linear-gradient(135deg, #FFEE55, #FFB700) !important;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7) !important;
        }
    </style>
</head>
<body>
    <h1>VSA Academy</h1>
    <button id="crypto-alerts-btn" class="crypto-alert-btn">تنبيهات الكريبتو</button>
</body>
</html>
