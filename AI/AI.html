<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI</title>
  <link rel="stylesheet" href="./style.css?v=2026.10.04.2">
</head>
<body>
  <nav class="section-nav">
    <a href="../index.html">⬅️ الموقع الرئيسي</a>
    <span class="section-nav-title">AI</span>
    <button type="button" id="addCardBtn" class="add-card-btn">➕ إضافة بطاقة</button>
  </nav>

  <main class="section-container">
    <h1 id="sectionTitle">AI</h1>
    <p id="sectionStatus" class="section-status">⏳ جارٍ تحميل بيانات القسم...</p>
    <section id="sectionGrid" class="section-grid" aria-live="polite"></section>
  </main>

  <div id="cardModal" class="card-modal" hidden>
    <div class="card-dialog" role="dialog" aria-modal="true" aria-labelledby="cardDialogTitle">
      <div class="dialog-head">
        <h2 id="cardDialogTitle">➕ إضافة بطاقة</h2>
        <button type="button" id="closeCardModal" class="dialog-close" aria-label="إغلاق">✕</button>
      </div>
      <form id="cardForm">
        <label>عنوان البطاقة
          <input name="title" maxlength="240" required>
        </label>
        <label>المحتوى
          <textarea name="content" rows="5" maxlength="4000"></textarea>
        </label>
        <div class="image-input-row">
          <label>رابط الصورة (اختياري)
            <input name="image" type="url" dir="ltr" placeholder="https://...">
          </label>
          <label>رفع صورة من الكمبيوتر (اختياري)
            <input name="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
          </label>
        </div>
        <div id="imagePreview" class="image-preview" hidden></div>
        <div class="image-input-hint">اختر رابط صورة أو صورة من جهاز الكمبيوتر. الصورة المرفوعة سيتم حفظها داخل مجلد <code>AI/images/</code>.</div>
        <div class="card-dialog-note">🔗 روابط المواقع تُدار من داخل صفحة البطاقة، وليس في البطاقة الرئيسية.</div>
        <div class="dialog-actions">
          <button type="submit" id="saveCardBtn" class="save-card-btn">💾 حفظ البطاقة</button>
          <button type="button" id="cancelCardBtn" class="cancel-card-btn">إلغاء</button>
        </div>
        <div id="cardFormStatus" class="form-status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <script src="../my_AI/bridge_auth.js?v=2026.10.03"></script>
  <script src="./ai.js?v=2026.10.04.2"></script>
</body>
</html>
