<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة بسيطة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
    }
    .calculator {
      width: 320px;
      padding: 20px;
      border-radius: 18px;
      background: #222;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    #display {
      width: 100%;
      height: 70px;
      margin-bottom: 15px;
      padding: 10px;
      border: 0;
      border-radius: 10px;
      background: #000;
      color: #fff;
      font-size: 30px;
      text-align: left;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 60px;
      border: 0;
      border-radius: 10px;
      background: #444;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    button:hover { background: #555; }
    .operator { background: #666; }
    .clear { background: #8b0000; }
    .equal { background: #087f23; }
  </style>
</head>
<body>
  <div class="calculator">
    <input id="display" type="text" value="0" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      if (display.value === '0' && /[0-9.]/.test(value)) {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      display.value = display.value.length > 1 ? display.value.slice(0, -1) : '0';
    }

    function calculate() {
      try {
        const expression = display.value.replace(/%/g, '/100');
        const result = Function('"use strict"; return (' + expression + ')')();
        display.value = Number.isFinite(result) ? result : 'خطأ';
      } catch {
        display.value = 'خطأ';
      }
    }
  </script>
</body>
</html>
